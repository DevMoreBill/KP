<body>
<header class="top">
  <div class="brand"><b>ПНЕВМО</b><i>ТЕХ</i><small>Конструктор КП</small></div>
  <span class="saved kpno" id="kpno"></span>
  <div class="sp"></div>
  <span class="saved" id="saved" aria-live="polite"></span>
  <button class="btn rem-btn" id="btnRem" type="button" hidden aria-label="Напоминания"><span aria-hidden="true">🔔</span> <b id="remN"></b></button>
  <span id="srvBtns" hidden><button class="btn" type="button" data-a="journal">Журнал КП</button> <button class="btn" type="button" data-a="openCatalog">Каталог</button></span>
  <button class="btn" id="btnNew" type="button">Новое КП</button>
  <button class="btn icon-btn help-btn" type="button" data-a="help" aria-label="Руководство пользователя" title="Руководство пользователя">?</button>
  <button class="btn mmenu-btn" id="btnMenu" type="button" aria-haspopup="dialog"><span aria-hidden="true">☰</span> Меню</button>
  <details class="topmenu"><summary class="btn icon-btn" aria-label="Ещё" title="Ещё">⋯</summary><div class="menu-l">
    <button type="button" data-a="myDay" hidden>Мой день</button>
    <button type="button" data-a="myPrefs">Мои настройки</button>
    <button type="button" data-a="docsFolder">Папка готовых КП</button>
    <hr><button type="button" data-a="help">Руководство пользователя</button>
    <button type="button" data-a="versions">История версий</button>
    <hr><button type="button" data-a="settings">⚙  Настройки (администратор)</button>
    <button type="button" data-a="uitexts" hidden>✎  Тексты интерфейса (правка)</button>
    <hr><button type="button" id="btnTheme">Тёмная тема</button>
    <button type="button" id="btnExit" hidden>Выход из программы</button></div></details>
</header>
<main class="wrap">
  <div id="nav"></div>
  <div id="form"></div>
  <aside id="side"></aside>
</main>
<nav class="mbar" id="mbar" aria-label="Шаги КП"></nav>
<dialog id="catdlg" class="catwin" aria-label="Каталог"></dialog>
<dialog id="pvdlg" class="kpprev" aria-label="Предпросмотр КП"></dialog>
<dialog id="dlg"></dialog>
<dialog id="edlg" class="editor" aria-label="Карточка позиции"></dialog>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="filePick" accept="image/*" hidden>
