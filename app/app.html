<style>
:root{
  --navy:#0B45A0; --sky:#3DA0EE; --ink:#1F2B4D; --muted:#66718C; --paper:#F3F6FB; --card:#FFFFFF;
  --line:#D9E6F3; --soft:#EAF4FD; --danger:#C23B22; --ok:#1E8E5A; --field:#FFFFFF; --panel:#0B2F6E; --panel-ink:#FFFFFF;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --ink:#E6ECF7; --muted:#9AA6BF; --paper:#0E1524; --card:#152036; --line:#26344F; --soft:#1A2A47; --field:#101a2e; --panel:#0B2F6E; --navy:#6FA8FF; --danger:#FF7A63; --ok:#4CC38A;
}}
:root[data-theme="dark"]{ --ink:#E6ECF7; --muted:#9AA6BF; --paper:#0E1524; --card:#152036; --line:#26344F; --soft:#1A2A47; --field:#101a2e; --panel:#0B2F6E; --navy:#6FA8FF; --danger:#FF7A63; --ok:#4CC38A; }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 "Onest",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
.top{display:flex;align-items:center;gap:16px;padding:14px 28px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.brand{font-weight:700;letter-spacing:.02em;font-size:17px}
.brand b{color:var(--navy)} .brand i{font-style:normal;color:var(--sky)}
.brand small{display:block;font-weight:500;letter-spacing:0;color:var(--muted);font-size:12.5px;margin-top:-2px}
.top .sp{flex:1}
.srvtag{font-size:12.5px;color:var(--ok);border:1px solid var(--ok);border-radius:999px;padding:3px 10px;margin-right:6px}
.curbar{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--soft)}
.cur-sel{min-width:200px}.cur-sel select{width:100%}
.rates{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding-bottom:8px;font-size:14px}
.rt{color:var(--muted)}.rt b{color:var(--ink);font-variant-numeric:tabular-nums}.rt.need b{color:var(--navy)}
details.psettings{margin:8px 0 16px;font-size:14px}details.psettings>summary{cursor:pointer;color:var(--navy);font-weight:600;padding:4px 0}
.mcell>span{white-space:nowrap}
.mtog{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;vertical-align:middle}
.mtog button{border:0;background:var(--card);padding:2px 8px;font-size:12px;cursor:pointer;color:var(--muted)}
.mtog button.on{background:var(--navy);color:#fff}
input.num:disabled{opacity:.5}
.tplpick{display:grid;grid-template-columns:260px 1fr auto;gap:12px;align-items:end;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:14px;background:var(--soft)}
.tplpick select{width:100%}.tplpick .muted{padding-bottom:10px;font-size:13px}
.tplside{font-size:13px;color:var(--muted);margin:0 0 8px}.tplside button{border:0;background:none;color:var(--navy);cursor:pointer;text-decoration:underline;padding:0}
@media (max-width:1000px){.tplpick{grid-template-columns:1fr}}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:14px}
.tile{display:flex;flex-direction:column;gap:4px;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:16px;cursor:pointer;color:var(--ink);min-height:84px}

.tag.kwt{background:var(--navy);color:#fff}
/* итог */
aside{position:sticky;top:84px;align-self:start}
.total{background:var(--panel);color:var(--panel-ink);border-radius:18px;padding:22px 22px 20px;position:relative;overflow:hidden}
.total::before{content:"";position:absolute;left:22px;top:0;width:56px;height:4px;background:var(--sky);border-radius:0 0 4px 4px}
.total .lab{font-size:13px;opacity:.75;margin-top:6px}
.total .big{font-size:34px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15;margin:4px 0 2px;overflow-wrap:anywhere}
.total .big small{font-size:17px;font-weight:600;opacity:.85}
.total dl{display:grid;grid-template-columns:1fr auto;gap:4px 12px;margin:14px 0 0;font-size:14px}
.total dt{opacity:.75} .total dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.mrg{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 18px;margin-top:14px;font-size:14px}
.mrg .lab{font-size:12px;color:var(--muted);margin-bottom:6px}
.mrg dl{display:grid;grid-template-columns:1fr auto;gap:4px 12px;margin:0}.mrg dt{color:var(--muted)}.mrg dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.total .words{font-size:13px;opacity:.85;margin-top:12px;line-height:1.45}
.checks{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-top:14px}
.checks h3{margin:0 0 8px;font-size:14px}
.checks ul{margin:0;padding:0;list-style:none;display:grid;gap:6px;font-size:13.5px}
.checks li{display:flex;gap:8px;align-items:flex-start}
.checks li::before{content:"";flex:0 0 8px;height:8px;border-radius:50%;background:var(--danger);margin-top:6px}
.checks li.ok::before{background:var(--ok)}
.checks li button{border:0;background:none;padding:0;color:inherit;text-align:left;cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.dl{width:100%;justify-content:center;margin-top:14px;padding:13px 16px;font-size:15px}
.fname{font-size:12px;color:var(--muted);margin-top:8px;overflow-wrap:anywhere;text-align:center}
.msg{font-size:13px;margin-top:8px;text-align:center}
.msg.err{color:var(--danger)} .msg.ok{color:var(--ok)}
dialog{border:0;border-radius:18px;padding:0;max-width:min(760px,94vw);width:100%;background:var(--card);color:var(--ink);box-shadow:0 30px 80px rgba(8,25,60,.35)}
dialog::backdrop{background:rgba(10,20,40,.45)}
.dlg-h{display:flex;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line)}
.dlg-h h3{margin:0;font-size:18px;flex:1}
.dlg-b{padding:16px 20px;max-height:65vh;overflow:auto}
.cat{display:grid;grid-template-columns:72px 1fr auto;gap:14px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.cat img,.cat .ph{width:72px;height:52px;object-fit:contain;border-radius:8px;background:var(--soft)}
.cat b{display:block;font-weight:600} .cat span{color:var(--muted);font-size:13px}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:14px;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:1000px){
  .pick{grid-template-columns:1fr}
  .attrs{grid-template-columns:1fr 1fr}
  .opt{grid-template-columns:1fr 64px 1fr 32px}.opt .s{display:none}
  .wrap{grid-template-columns:1fr;padding:16px}
  aside{position:static}
  .item-head{grid-template-columns:1fr 1fr}
  .item-no{display:none}
  .item-head>label:first-of-type{grid-column:1/-1}
  .item-head .acts{grid-column:1/-1;justify-content:flex-end}
  .item-sum{flex-wrap:wrap;gap:10px}
  .brand small{display:none}
  .mbar{display:flex}
  body{padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
  .toast{bottom:calc(88px + env(safe-area-inset-bottom,0px))}
  .g4{grid-template-columns:1fr 1fr} .g3{grid-template-columns:1fr}
  .media{grid-template-columns:1fr}
  .feat{grid-template-columns:1fr 32px} .feat input:first-child{grid-column:1/-1}
}
@media (max-width:620px){ .g2{grid-template-columns:1fr} .top{padding:12px 16px} .step{padding:18px} .srow{grid-template-columns:1fr 1fr 28px 28px} }
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>

<body>
<header class="top">
  <div class="brand"><b>ПНЕВМО</b><i>ТЕХ</i><small>Конструктор технико-коммерческих предложений</small></div>
  <div class="sp"></div>
  <span class="saved" id="saved" aria-live="polite"></span>
  <span class="saved" id="kpno"></span><span id="srvBtns" hidden><button class="btn" type="button" data-a="journal">Журнал КП</button> <button class="btn" type="button" data-a="openCatalog">Каталог</button> <button class="btn" type="button" data-a="docsFolder">Папка КП</button></span>
  <button class="btn" type="button" data-a="typesEdit">Типы оборудования</button>
  <button class="btn" id="btnNew" type="button">Новое КП</button><button class="btn ghost" id="btnExit" type="button" hidden>Выход</button>
</header>
<main class="wrap">
  <div id="nav"></div>
  <div id="form"></div>
  <aside id="side"></aside>
</main>
<div class="mbar" id="mbar"><b id="mtotal">0,00 руб.</b><button class="btn" type="button" data-go="side">Скачать</button></div>
<dialog id="dlg"></dialog>
<dialog id="edlg" class="editor" aria-label="Карточка позиции"></dialog>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="filePick" accept="image/*" hidden>
<script>/* Генератор ТКП ПНЕВМОТЕХ: собирает document.xml, footer1.xml и связи.
   Чистые функции, без DOM — используются и в браузере, и в тестах. */
(function (root) {
  'use strict';
  let BLUE = '0B45A0', SKY = '3DA0EE', NAVYD = '143A7F', DARK = '1F2B4D', GRAY = '66718C',
      LIGHT = 'EAF4FD', LINE = 'CFE0F2', HAIR = 'D9E6F3';
  const W = 10347, E = 635, NB = '\u00A0';
  // Шаблон КП: цвета, тексты «О компании», подвал, раздел клиентов, основа DOCX (шапка, поля страницы).
  const TPL_DEFAULT = {
    brandParts: [['ПНЕВМО', 'BLUE'], ['ТЕХ', 'SKY']], site: 'www.kompr.ru',
    about: ' — интегратор комплексных решений для промышленности. С 1995 года поставляем и обслуживаем компрессорное, генераторное и насосное оборудование — для малых предприятий, ЖКХ и крупных промышленных компаний.',
    advantages: [['Сроки', 'Поставляем оборудование сами и отвечаем за соблюдение согласованных сроков.'], ['Качество', 'Всё оборудование сопровождается необходимыми сертификатами.'], ['Сервис', 'Собственная сервисная служба и поставка запчастей после покупки.']],
    trust: 'Газпром трансгаз Санкт-Петербург, Сбербанк, РЖД, аэропорт Шереметьево, РУСАЛ, АЛРОСА, Мосводоканал, Мосметрострой',
    clientsTitle: 'Наши клиенты', closing: ''
  };
  let TPL = TPL_DEFAULT;
  function setTemplate(t) {
    TPL = Object.assign({}, TPL_DEFAULT, t || {});
    const c = TPL.colors || {};
    BLUE = c.BLUE || '0B45A0'; SKY = c.SKY || '3DA0EE'; NAVYD = c.NAVYD || '143A7F'; DARK = c.DARK || '1F2B4D';
    GRAY = c.GRAY || '66718C'; LIGHT = c.LIGHT || 'EAF4FD'; LINE = c.LINE || 'CFE0F2'; HAIR = c.HAIR || 'D9E6F3';
  }
  const COL = k => ({ BLUE, SKY, NAVYD, DARK, GRAY })[k] || k;
  const brandRuns = (sz) => (TPL.brandParts || []).map(([t, c]) => r(t, { sz, color: COL(c), b: true })).join('');

  const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

  function r(t, o = {}) {
    const sz = o.sz || 20, color = o.color || DARK;
    let rp = '<w:rFonts w:ascii="Arial" w:eastAsia="Arial" w:hAnsi="Arial" w:cs="Arial"/>';
    if (o.b) rp += '<w:b/><w:bCs/>';
    if (o.i) rp += '<w:i/><w:iCs/>';
    if (o.caps) rp += '<w:caps/>';
    rp += `<w:color w:val="${color}"/>`;
    if (o.sp) rp += `<w:spacing w:val="${o.sp}"/>`;
    rp += `<w:sz w:val="${sz}"/><w:szCs w:val="${sz}"/><w:lang w:val="ru-RU"/>`;
    return `<w:r><w:rPr>${rp}</w:rPr><w:t xml:space="preserve">${esc(t)}</w:t></w:r>`;
  }
  function p(runs = '', o = {}) {
    let pp = '';
    if (o.keep) pp += '<w:keepNext/>';
    if (o.pbb) pp += '<w:pageBreakBefore/>';
    if (o.bdr) pp += `<w:pBdr>${o.bdr}</w:pBdr>`;
    const ls = o.line ? ` w:line="${o.line}" w:lineRule="auto"` : '';
    pp += `<w:spacing w:before="${o.before || 0}" w:after="${o.after || 0}"${ls}/>`;
    if (o.indL || o.indR) pp += `<w:ind w:left="${o.indL || 0}" w:right="${o.indR || 0}"/>`;
    pp += `<w:jc w:val="${o.jc || 'left'}"/>`;
    return `<w:p><w:pPr>${pp}</w:pPr>${runs}</w:p>`;
  }
  const spacer = h => `<w:p><w:pPr><w:spacing w:before="0" w:after="0" w:line="${h}" w:lineRule="exact"/><w:rPr><w:sz w:val="2"/></w:rPr></w:pPr></w:p>`;
  const END = '<w:p><w:pPr><w:spacing w:before="0" w:after="0" w:line="20" w:lineRule="exact"/></w:pPr></w:p>';
  const line = (side, sz, color) => `<w:${side} w:val="single" w:sz="${sz}" w:space="0" w:color="${color}"/>`;
  function B(top, left, bottom, right) {
    const one = (s, v) => v ? line(s, v[0], v[1]) : `<w:${s} w:val="nil"/>`;
    return one('top', top) + one('left', left) + one('bottom', bottom) + one('right', right);
  }
  function tc(content, w, o = {}) {
    const [t, l, b, rr] = o.mar || [70, 120, 70, 120];
    let pr = `<w:tcW w:w="${w}" w:type="dxa"/>`;
    if (o.span > 1) pr += `<w:gridSpan w:val="${o.span}"/>`;
    pr += `<w:tcBorders>${o.bdr || B()}</w:tcBorders>`;
    if (o.fill) pr += `<w:shd w:val="clear" w:color="auto" w:fill="${o.fill}"/>`;
    pr += `<w:tcMar><w:top w:w="${t}" w:type="dxa"/><w:left w:w="${l}" w:type="dxa"/><w:bottom w:w="${b}" w:type="dxa"/><w:right w:w="${rr}" w:type="dxa"/></w:tcMar>`;
    pr += `<w:vAlign w:val="${o.va || 'center'}"/>`;
    return `<w:tc><w:tcPr>${pr}</w:tcPr>${content || '<w:p/>'}</w:tc>`;
  }
  function tbl(rows, widths, o = {}) {
    const grid = widths.map(x => `<w:gridCol w:w="${x}"/>`).join('');
    const pr = `<w:tblW w:w="${widths.reduce((a, b) => a + b, 0)}" w:type="dxa"/><w:tblInd w:w="0" w:type="dxa"/>` +
      '<w:tblBorders><w:top w:val="nil"/><w:left w:val="nil"/><w:bottom w:val="nil"/><w:right w:val="nil"/><w:insideH w:val="nil"/><w:insideV w:val="nil"/></w:tblBorders>' +
      '<w:tblLayout w:type="fixed"/><w:tblCellMar><w:left w:w="0" w:type="dxa"/><w:right w:w="0" w:type="dxa"/></w:tblCellMar><w:tblLook w:val="0000"/>';
    const hs = o.heights || {};
    const body = rows.map((row, i) => {
      let trp = '';
      if (hs[i]) trp += `<w:trHeight w:val="${hs[i]}" w:hRule="exact"/>`;
      if (o.split !== true) trp += '<w:cantSplit/>';
      if (o.header && i === 0) trp += '<w:tblHeader/>';
      return `<w:tr><w:trPr>${trp}</w:trPr>${row.join('')}</w:tr>`;
    }).join('');
    return `<w:tbl><w:tblPr>${pr}</w:tblPr><w:tblGrid>${grid}</w:tblGrid>${body}</w:tbl>`;
  }
  let PID = 9000;
  function img(rid, cx, cy, name) {
    const id = ++PID;
    return '<w:r><w:rPr><w:noProof/></w:rPr><w:drawing><wp:inline distT="0" distB="0" distL="0" distR="0">' +
      `<wp:extent cx="${cx}" cy="${cy}"/><wp:effectExtent l="0" t="0" r="0" b="0"/><wp:docPr id="${id}" name="${esc(name)}"/>` +
      '<wp:cNvGraphicFramePr><a:graphicFrameLocks xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" noChangeAspect="1"/></wp:cNvGraphicFramePr>' +
      '<a:graphic xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture">' +
      '<pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture">' +
      `<pic:nvPicPr><pic:cNvPr id="${id}" name="${esc(name)}"/><pic:cNvPicPr/></pic:nvPicPr>` +
      `<pic:blipFill><a:blip r:embed="${rid}"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill>` +
      `<pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr>` +
      '</pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r>';
  }
  // скруглённая подложка за таблицей
  function rbg(wd, hd, color, rad, yoff, xoff) {
    const id = ++PID, w = wd * E, h = hd * E;
    const adj = Math.floor(Math.min(50000, rad / Math.min(wd, hd) * 100000));
    const arc = (2 * adj / 100000).toFixed(4);
    const dml = `<wp:anchor distT="0" distB="0" distL="0" distR="0" simplePos="0" relativeHeight="${id}" behindDoc="1" locked="0" layoutInCell="1" allowOverlap="1">` +
      '<wp:simplePos x="0" y="0"/><wp:positionH relativeFrom="column"><wp:posOffset>' + ((xoff || 0) * E) + '</wp:posOffset></wp:positionH>' +
      `<wp:positionV relativeFrom="paragraph"><wp:posOffset>${yoff * E}</wp:posOffset></wp:positionV>` +
      `<wp:extent cx="${w}" cy="${h}"/><wp:effectExtent l="0" t="0" r="0" b="0"/><wp:wrapNone/>` +
      `<wp:docPr id="${id}" name="Подложка ${id}"/><wp:cNvGraphicFramePr/>` +
      '<a:graphic xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"><a:graphicData uri="http://schemas.microsoft.com/office/word/2010/wordprocessingShape">' +
      `<wps:wsp><wps:cNvSpPr/><wps:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${w}" cy="${h}"/></a:xfrm>` +
      `<a:prstGeom prst="roundRect"><a:avLst><a:gd name="adj" fmla="val ${adj}"/></a:avLst></a:prstGeom>` +
      `<a:solidFill><a:srgbClr val="${color}"/></a:solidFill><a:ln><a:noFill/></a:ln></wps:spPr><wps:bodyPr/></wps:wsp></a:graphicData></a:graphic></wp:anchor>`;
    const vml = `<w:pict><v:roundrect id="bg${id}" o:spid="_x0000_s${id}" arcsize="${arc}" style="position:absolute;margin-left:${(xoff || 0) / 20}pt;margin-top:${yoff / 20}pt;width:${wd / 20}pt;height:${hd / 20}pt;z-index:-${id};mso-position-horizontal-relative:text;mso-position-vertical-relative:text" fillcolor="#${color}" stroked="f"/></w:pict>`;
    return '<w:r><w:rPr><w:noProof/></w:rPr><mc:AlternateContent><mc:Choice Requires="wps"><w:drawing>' + dml +
      '</w:drawing></mc:Choice><mc:Fallback>' + vml + '</mc:Fallback></mc:AlternateContent></w:r>';
  }
  const bgpara = (wd, hd, color, rad = 110, h = 20) =>
    `<w:p><w:pPr><w:keepNext/><w:spacing w:before="0" w:after="0" w:line="${h}" w:lineRule="exact"/><w:rPr><w:sz w:val="2"/></w:rPr></w:pPr>${rbg(wd, hd, color, rad, h)}</w:p>`;
  const hyper = (rid, runs) => `<w:hyperlink r:id="${rid}">${runs}</w:hyperlink>`;

  function heading(title, pbb) {
    return p(r(title, { sz: 32, color: BLUE, b: true }), { after: 90, keep: true, line: 240, pbb }) +
      p('', { after: 220, indR: W - 1500, keep: true, bdr: line('bottom', 18, SKY) });
  }

  // ---------- числа ----------
  const curCode = S => (S && S.cur && S.cur.code) || 'RUB';
  const curSh = S => (CURS[curCode(S)] || CURS.RUB).sh;
  function money(kop) {
    const neg = kop < 0; kop = Math.abs(Math.round(kop));
    const rub = Math.floor(kop / 100), k = kop % 100;
    const s = String(rub).replace(/\B(?=(\d{3})+(?!\d))/g, NB);
    return (neg ? '−' : '') + s + ',' + String(k).padStart(2, '0');
  }
  const U = ['', 'один', 'два', 'три', 'четыре', 'пять', 'шесть', 'семь', 'восемь', 'девять'];
  const UF = ['', 'одна', 'две'].concat(U.slice(3));
  const T = ['десять', 'одиннадцать', 'двенадцать', 'тринадцать', 'четырнадцать', 'пятнадцать', 'шестнадцать', 'семнадцать', 'восемнадцать', 'девятнадцать'];
  const D = ['', '', 'двадцать', 'тридцать', 'сорок', 'пятьдесят', 'шестьдесят', 'семьдесят', 'восемьдесят', 'девяносто'];
  const H = ['', 'сто', 'двести', 'триста', 'четыреста', 'пятьсот', 'шестьсот', 'семьсот', 'восемьсот', 'девятьсот'];
  function g3(n, fem) {
    const w = [H[Math.floor(n / 100)]], t = n % 100;
    if (t >= 10 && t < 20) w.push(T[t - 10]); else w.push(D[Math.floor(t / 10)], (fem ? UF : U)[t % 10]);
    return w.filter(Boolean).join(' ');
  }
  function plural(n, f1, f2, f5) {
    const t = n % 100; if (t > 10 && t < 20) return f5;
    const u = n % 10; return u === 1 ? f1 : (u >= 2 && u <= 4 ? f2 : f5);
  }
  const CURS = {
    RUB: { sh: 'руб.', main: ['рубль', 'рубля', 'рублей'], sub: ['копейка', 'копейки', 'копеек'], name: 'рублях' },
    USD: { sh: 'USD', main: ['доллар США', 'доллара США', 'долларов США'], sub: ['цент', 'цента', 'центов'], name: 'долларах США' },
    EUR: { sh: 'EUR', main: ['евро', 'евро', 'евро'], sub: ['евроцент', 'евроцента', 'евроцентов'], name: 'евро' },
    CNY: { sh: 'CNY', main: ['юань', 'юаня', 'юаней'], sub: ['фэнь', 'фэня', 'фэней'], name: 'китайских юанях' }
  };
  function words(kop, code) {
    const C = CURS[code] || CURS.RUB;
    const rub = Math.floor(kop / 100), k = kop % 100;
    const tail = `${String(k).padStart(2, '0')} ${plural(k, ...C.sub)}`;
    if (rub === 0) return `ноль ${C.main[2]} ${tail}`;
    const groups = [[1e9, ['миллиард', 'миллиарда', 'миллиардов'], false], [1e6, ['миллион', 'миллиона', 'миллионов'], false], [1e3, ['тысяча', 'тысячи', 'тысяч'], true]];
    let n = rub; const out = [];
    for (const [base, f, fem] of groups) {
      const g = Math.floor(n / base) % 1000;
      if (g) out.push(g3(g, fem) + ' ' + plural(g, ...f));
    }
    const u = n % 1000; if (u) out.push(g3(u, false));
    return `${out.join(' ')} ${plural(rub, ...C.main)} ${tail}`;
  }
  const MONTHS = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
  function ruDate(iso) {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || ''); if (!m) return iso || '';
    return `${+m[3]} ${MONTHS[+m[2] - 1]} ${m[1]} г.`;
  }
  function totals(items, vatRate) {
    let sum = 0, units = 0;
    for (const it of items) {
      const q = +it.qty || 0; sum += q * (it.price || 0); units += q;
      for (const o of (it.options || [])) sum += (+o.qty || 0) * (o.price || 0);
    }
    const vat = Math.round(sum * vatRate / (100 + vatRate));
    return { sum, units, vat, net: sum - vat };
  }

  // ---------- страницы ----------
  function coverXml(S, M) {
    const out = [], t = totals(S.items, S.vat);

          const body = ph + p(r(st.model, { sz: 20, color: BLUE, b: true }), { jc: 'center', after: 30, line: 240 }) +

    } else if (M.cover) {

  const LOGOS = '<w:p><w:pPr><w:ind w:left="-426"/></w:pPr><w:r><w:rPr><w:noProof/></w:rPr><w:drawing><wp:inline distT="0" distB="0" distL="0" distR="0"><wp:extent cx="7108166" cy="7165700"/><wp:effectExtent l="0" t="0" r="0" b="0"/><wp:docPr id="13" name="Логотипы клиентов"/><wp:cNvGraphicFramePr/><a:graphic xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:nvPicPr><pic:cNvPr id="13" name="Логотипы клиентов"/><pic:cNvPicPr/></pic:nvPicPr><pic:blipFill><a:blip r:embed="rId8"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill><pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="7108166" cy="7165700"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r></w:p>';

  const HDR = (t, w, jc = 'left', span = 1) => tc(p(r(t, { sz: 14, color: 'FFFFFF', b: true, caps: true, sp: 15 }), { jc }), w, { mar: [0, 120, 0, 120], span });
  const cell = (t, w, o = {}) => tc(p(r(t, { sz: o.sz || 18, color: o.color || DARK, b: o.b }), { jc: o.jc || 'left' }), w,
    { bdr: o.last ? B() : B(null, null, [4, HAIR]), mar: o.mar || [36, 120, 36, 120] });

  function balance(groups) {
    const n = g => g.rows.length + 1, total = groups.reduce((a, g) => a + n(g), 0);
    let acc = 0, k = 0;
    for (; k < groups.length; k++) { if (acc + n(groups[k]) / 2 > total / 2 && k > 0) break; acc += n(groups[k]); }
    return [groups.slice(0, k), groups.slice(k)];
  }
  // подзаголовок группы характеристик (Двигатель, Альтернатор…): светлая плашка и синяя полоса слева
  function grpCell(name, w) {
    return tc(p(r(name, { sz: 16, color: BLUE, b: true, caps: true, sp: 20 })), w,
      { span: 2, fill: LIGHT, bdr: B(null, [36, BLUE], [6, SKY]), mar: [110, 140, 90, 140] });
  }
  // «не отрывать»: все абзацы строк таблицы держатся со следующими — Word переносит такой блок целиком
  const keepAll = xml => xml.replace(/<w:pPr>/g, '<w:pPr><w:keepNext/>').replace(/<w:p>(?!<w:pPr>)/g, '<w:p><w:pPr><w:keepNext/></w:pPr>');
  function specTable(groups, wl) {
    const rows = [[HDR('Параметр', wl[0]), HDR('Значение', wl[1])]];
    for (const g of groups) {
      if (g.name) rows.push([grpCell(g.name, wl[0] + wl[1])]);
      g.rows.forEach((row, i) => {
        const last = i === g.rows.length - 1;
        rows.push([cell(row.k, wl[0], { sz: 16, last }), cell(row.v, wl[1], { sz: 16, b: true, color: row.hl ? BLUE : DARK, last })]);
      });
    }
    return bgpara(wl[0] + wl[1], 380, NAVYD, 90) + tbl(rows, wl, { heights: { 0: 380 } });
  }

  // Дополнительные изображения: сетка карточек 2 в ряд, схемы и чертежи — на всю ширину.
  // Каждый ряд — отдельная неразрывная таблица: при нехватке места на странице переносится
  // ряд целиком (пустое место — не больше высоты одного ряда), заголовок держится с первым рядом.
  const PXCAP = 914400 / 150;   // EMU на пиксель при 150 dpi
  function galleryXml(list) {
    if (!list || !list.length) return '';
    const out = [spacer(list.length <= 2 ? 160 : 300), heading('Фото и схемы')];
    const HALF = 5073, GAP = 201, FULL = W;
    const card = (g, w, boxW, boxH) => {
      const k = Math.min(boxW / g.w, boxH / g.h, PXCAP);
      const body = p(img(g.rid, Math.round(g.w * k), Math.round(g.h * k), g.caption || 'Изображение'), { jc: 'center', after: g.caption ? 80 : 0 }) +
        (g.caption ? p(r(g.caption, { sz: 16, b: true }), { jc: 'center', line: 240 }) : '');
      return tc(body, w, { bdr: B([4, HAIR], [4, HAIR], [4, HAIR], [4, HAIR]), va: 'center', mar: [140, 120, 140, 120] });
    };
    const halfBox = [(HALF - 260) * E, list.length <= 2 ? 1450000 : 1850000], fullBox = [(FULL - 260) * E, 3600000];
    // раскладка: половинки парами по порядку; широкое изображение, попавшее между половинками, ставится после пары
    const rows = []; let pend = null; const deferred = [];
    for (const g of list) {
      if (g.wide) { if (pend) deferred.push(g); else rows.push([g]); continue; }
      if (pend) { rows.push([pend, g]); pend = null; while (deferred.length) rows.push([deferred.shift()]); }
      else pend = g;
    }
    if (pend) rows.push([pend]);
    while (deferred.length) rows.push([deferred.shift()]);
    rows.forEach((row, n) => {
      if (n) out.push(spacer(160));
      if (row.length === 2) out.push(tbl([[card(row[0], HALF, ...halfBox), tc(END, GAP, { mar: [0, 0, 0, 0] }), card(row[1], HALF, ...halfBox)]], [HALF, GAP, HALF]));
      else if (row[0].wide) out.push(tbl([[card(row[0], FULL, ...fullBox)]], [FULL]));
      else { // одиночная половинка — по центру, без пустой колонки рядом
        const side = Math.floor((FULL - HALF) / 2);
        out.push(tbl([[tc(END, side, { mar: [0, 0, 0, 0] }), card(row[0], HALF, ...halfBox), tc(END, FULL - HALF - side, { mar: [0, 0, 0, 0] })]], [side, HALF, FULL - HALF - side]));
      }
    });
    return out.join('');
  }
  function equipXml(it, M) {
    const out = [heading(it.pageTitle || it.name, true)];

    const fimg = m.featImgs || {};

    // длинные тексты (о серии, стандартная комплектация) — отдельным разделом на всю ширину, чтобы не перегружать верх страницы
    const longF = allF.filter(f => !(f.id && fimg[f.id]) && (f.text || '').length > 230);

      if (desc) out.push(tbl([[tc(desc, 5000, { mar: [0, 0, 0, 200] }), tc(END, 300, { mar: [0, 0, 0, 0] }), photo]], [5000, 300, 5047]));
      else out.push(p(img(m.tile.rid, cx, cy, it.name), { jc: 'center' }));
    } else if (desc) out.push(desc);
    // «Узлы и компоненты»: блок описания и его фото рядом; каждый блок — неразрывная строка,
    // фото чередуются слева/справа, при нехватке места блок целиком переносится на следующую страницу
    if (illustrated.length) {

      out.push(heading('Узлы и компоненты'));
      const IW = 3900, GAPW = 300, TW = W - IW - GAPW, boxW = (IW - 160) * E, boxH = 2000000;
      illustrated.forEach((f, n) => {
        const g = fimg[f.id]; const k = Math.min(boxW / g.w, boxH / g.h, PXCAP);
        const picCell = tc(p(img(g.rid, Math.round(g.w * k), Math.round(g.h * k), f.label || 'Узел'), { jc: 'center' }), IW,
          { bdr: B([4, HAIR], [4, HAIR], [4, HAIR], [4, HAIR]), va: 'center', mar: [100, 80, 100, 80] });
        const txtCell = tc((f.label ? p(r(f.label, { sz: 15, color: BLUE, b: true, caps: true, sp: 15 }), { after: 60 }) : '') +
          p(r(f.text || '', { sz: 18 }), { line: 264 }), TW, { va: 'center', mar: [60, 0, 60, 0] });
        const gapCell = tc(END, GAPW, { mar: [0, 0, 0, 0] });
        if (n) out.push(spacer(200));
        out.push(n % 2 === 0 ? tbl([[picCell, gapCell, txtCell]], [IW, GAPW, TW]) : tbl([[txtCell, gapCell, picCell]], [TW, GAPW, IW]));
      });

    if (longF.length) {
      out.push(spacer(300));
      out.push(heading('Особенности и комплектация'));
      longF.forEach((f, n) => {

        out.push(p(r(f.text || '', { sz: 18 }), { line: 264, jc: 'both' }));

    }
    const groups = (it.groups || []).map(g => ({ name: g.name, rows: (g.rows || []).filter(x => x.k || x.v) })).filter(g => g.rows.length);
    if (groups.length) {
      out.push(spacer(300));
      out.push(heading('Технические характеристики'));
      const nrows = groups.reduce((a, g) => a + g.rows.length + 1, 0);
      if (nrows > 14) {
        // две колонки в одной «плоской» таблице: каждая строка независима, поэтому длинная таблица
        // аккуратно переносится на следующую страницу, не оставляя пустых мест
        const [L, R] = balance(groups);
        const flat = gs => gs.flatMap(g => [{ g: g.name }].concat(g.rows.map((row, i) => ({ k: row.k, v: row.v, hl: row.hl, last: i === g.rows.length - 1 }))));
        const a = flat(L), b = flat(R), n = Math.max(a.length, b.length);

        };
        const rows = [[HDR('Параметр', wk), HDR('Значение', wv), tc(END, gap, { mar: [0, 0, 0, 0] }), HDR('Параметр', wk), HDR('Значение', wv)]];

// «ОБЩЕСТВО С ОГРАНИЧЕННОЙ ОТВЕТСТВЕННОСТЬЮ "РОМАШКА"» → ООО «Ромашка»
function shortName(s){
  s=String(s||'').trim(); if (!s) return s;
  const OPF=[[/^ОБЩЕСТВО С ОГРАНИЧЕННОЙ ОТВЕТСТВЕННОСТЬЮ\s*/i,'ООО'],[/^ПУБЛИЧНОЕ АКЦИОНЕРНОЕ ОБЩЕСТВО\s*/i,'ПАО'],[/^НЕПУБЛИЧНОЕ АКЦИОНЕРНОЕ ОБЩЕСТВО\s*/i,'АО'],[/^АКЦИОНЕРНОЕ ОБЩЕСТВО\s*/i,'АО'],
    [/^ИНДИВИДУАЛЬНЫЙ ПРЕДПРИНИМАТЕЛЬ\s*/i,'ИП'],[/^ФЕДЕРАЛЬНОЕ ГОСУДАРСТВЕННОЕ УНИТАРНОЕ ПРЕДПРИЯТИЕ\s*/i,'ФГУП'],[/^МУНИЦИПАЛЬНОЕ УНИТАРНОЕ ПРЕДПРИЯТИЕ\s*/i,'МУП'],[/^ГОСУДАРСТВЕННОЕ УНИТАРНОЕ ПРЕДПРИЯТИЕ\s*/i,'ГУП']];
  for (const [rx,ab] of OPF) if (rx.test(s)) s=ab+' '+s.replace(rx,'');
  const m=s.match(/^(ООО|АО|ПАО|ЗАО|ОАО|ИП|ФГУП|МУП|ГУП)\s+["«„]?(.+?)["»“]?$/);
  if (m){ let nm=m[2].replace(/^["«„]|["»“]$/g,''); if (nm===nm.toUpperCase() && /[А-ЯЁ]/.test(nm) && m[1]!=='ИП') nm=nm.toLowerCase().replace(/(^|[\s\-"«])([а-яё])/g,(x,a,b)=>a+b.toUpperCase());
    if (m[1]==='ИП') nm=nm.toLowerCase().replace(/(^|\s)([а-яё])/g,(x,a,b)=>a+b.toUpperCase());
    return m[1]==='ИП' ? 'ИП '+nm : `${m[1]} «${nm}»`; }
  return s;
}

function quickMatches(q){
  const w=norm(q).split(' ').filter(Boolean); if(!w.length) return [];
  const res=[];
  for (const x of catCache){ const a=attrsOf(x); if (typeById(a.cat).role==='accessory') continue;
    const hay=norm([x.name,x.spec,a.maker,a.model,a.series,a.engine,a.alternator].join(' '));
    if (w.every(v=>hay.includes(v))) res.push(x); if (res.length>=40) break; }
  const mv=x=>numOf(attrsOf(x)[typeById(attrsOf(x).cat).main||'kw'])??9e9;
  return res.sort((p,q)=>String(attrsOf(p).cat).localeCompare(attrsOf(q).cat)||mv(p)-mv(q)).slice(0,8);
}

function pickImage(kind,i){ const f=$('#filePick'); f.value=''; f.onchange=()=>f.files[0]&&loadImage(f.files[0],kind,i); f.click(); }
function readImg(src){ return new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=rej; im.src=src; }); }
function fileToURL(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); }); }
async function prepImage(src, kind){
  const im=await readImg(src); const max=1600, sc=Math.min(1, max/Math.max(im.width,im.height));
  let w=Math.round(im.width*sc), h=Math.round(im.height*sc);
  const c=document.createElement('canvas'); c.width=w; c.height=h; const g=c.getContext('2d'); g.drawImage(im,0,0,w,h);
  // обрезка белых/прозрачных полей
  const d=g.getImageData(0,0,w,h).data; let x0=w,y0=h,x1=-1,y1=-1;
  for(let y=0;y<h;y+=1) for(let x=0;x<w;x+=1){ const o=(y*w+x)*4; if (d[o+3]>20 && (d[o]<240||d[o+1]<240||d[o+2]<240)){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; } }
  let out=c;
  if (x1>x0 && y1>y0){ const pad=Math.round(Math.max(w,h)*0.015); x0=Math.max(0,x0-pad); y0=Math.max(0,y0-pad); x1=Math.min(w-1,x1+pad); y1=Math.min(h-1,y1+pad);
    out=document.createElement('canvas'); out.width=x1-x0+1; out.height=y1-y0+1; const og=out.getContext('2d');
    if (kind!=='logo'){ og.fillStyle='#fff'; og.fillRect(0,0,out.width,out.height); }
    og.drawImage(c,-x0,-y0); }
  const type = kind==='logo' ? 'image/png' : 'image/jpeg';
  return { src: out.toDataURL(type, 0.9), w: out.width, h: out.height };
}
async function loadImage(file, kind, i){
  if (!file.type.startsWith('image/')) return toast('Нужен файл изображения: JPG, PNG или WEBP');
  try { const img=await prepImage(await fileToURL(file), kind); S.items[i][kind]=img; renderForm(); persist(); }
  catch(e){ toast('Не удалось открыть изображение'); }
}
function tileFrom(img){ // скруглённая плитка для страницы оборудования

    const W=1300,H=860,c=document.createElement('canvas'); c.width=W; c.height=H; const g=c.getContext('2d');

function parseSpecs(txt){
  const groups=[]; let g=null;
  txt.split(/\r?\n/).forEach(l=>{
    if(!l.trim()) return;
    let cells = l.includes('\t') ? l.split('\t') : (l.includes(':') ? [l.slice(0,l.indexOf(':')), l.slice(l.indexOf(':')+1)] : [l]);
    cells=cells.map(s=>s.trim()).filter((s,ix,a)=>ix<2||s);
    if (cells.filter(Boolean).length===1){ g={name:cells.find(Boolean),rows:[]}; groups.push(g); return; }
    if(!g){ g={name:'',rows:[]}; groups.push(g); }
    g.rows.push({k:cells[0],v:cells.slice(1).filter(Boolean).join(' ')});
  });
  return groups.filter(x=>x.rows.length);
}

function aiApply(i){

  if (j.attrs && typeof j.attrs==='object'){ const keepCat=(it.attrs||{}).cat; it.attrs=Object.fromEntries(Object.entries(j.attrs).filter(([k,v])=>v!==''&&v!=null&&!String(v).includes(' | ')));

function applyCover(h, force){

async function saveFile(name, blob){

/* ---------- валюты, курсы, маржа ---------- */
const CUR_LIST=['RUB','USD','EUR','CNY'];
const curSh = c => (CURS[c]||CURS.RUB).sh;
const kpCur = () => S.pricing.cur||'RUB';
function rateOf(c){ if (c==='RUB') return 1; const v=parseFloat(String(S.pricing.rates[c]||'').replace(/\s/g,'').replace(',','.')); return v>0?v:NaN; }
function roundTo(kop){ const st=Math.round(parseFloat(S.pricing.round||'0.01')*100)||1; return Math.round(kop/st)*st; }
// маржа (% от цены продажи) или наценка (% к закупке) — задаётся у каждой позиции; общей «маржи по умолчанию» нет
function marginOf(x){ if (x.margin==null || x.margin==='') return null; const m=parseFloat(String(x.margin).replace(',','.')); return Number.isFinite(m)?m:null; }
const modeOf = x => x.mmode==='markup' ? 'markup' : 'margin';
function costKP(x){  // себестоимость единицы в валюте КП, копейки (с НДС)
  if (!x.cost) return null;
  const r1=rateOf(x.costCur||'RUB'), r2=rateOf(kpCur()); if (!(r1>0&&r2>0)) return NaN;
  let v=x.cost*r1/r2; if (S.pricing.costNoVat) v*=1+(+S.vat||0)/100; return v;
}
function calcPrice(x){
  const c=costKP(x); if (c==null||Number.isNaN(c)) return c;
  const mv=marginOf(x); if (mv==null) return null; const m=mv/100;
  const v = modeOf(x)==='markup' ? c*(1+m) : (m<0.99 ? c/(1-m) : NaN);
  return Number.isNaN(v)?NaN:roundTo(v);
}
function applyCalc(x){ if (x.priceManual || !x.cost || marginOf(x)==null) return; const p=calcPrice(x); if (p>0){ x.price=p; delete x._priceText; } }
// фактическая маржа/наценка при текущей цене (для подсказки, когда цена введена вручную)
function actualPct(x){ const c=costKP(x); if (!c||Number.isNaN(c)||!x.price) return null; const pr=x.price-c; return modeOf(x)==='markup' ? pr/c*100 : pr/x.price*100; }
function recalcAll(){ S.items.forEach(applyCalc); }
let _autoRates=false;
function autoRates(){ const need=[kpCur(),...S.items.filter(x=>x.cost).map(x=>x.costCur||'RUB')].filter(c=>c!=='RUB'&&!(rateOf(c)>0)); if(need.length && !_autoRates){ _autoRates=true; loadCBR().finally(()=>{_autoRates=false;}); } }
async function loadCBR(){

  let r=null, src='', why='';

  try{ r=await api('/api/cbr'); src=r.src||'ЦБ РФ (cbr.ru)'; if(!r.USD){ why=r.error||''; r=null; } }catch(e){ why=String(e.message||e).slice(0,160); }
  if (btn){ btn.disabled=false; btn.textContent='Обновить с cbr.ru'; }
  if (!r || !r.USD){ const m=$('#cbrMsg'); if(m){ m.textContent='Курс с cbr.ru не получен'+(why?` (${why})`:'')+' — введите вручную ниже.'; m.classList.add('bad-t'); } document.querySelector('details.psettings')?.setAttribute('open',''); document.querySelector('[data-rate]')?.focus(); toast('Курс ЦБ не загружен — введите вручную'); return; }
  const got=[]; for (const c of ['USD','EUR','CNY']) if (r[c]) { S.pricing.rates[c]=(+r[c]).toFixed(4).replace('.',','); got.push(c); }
  S.pricing.rateDate=r.date||today(); S.pricing.rateSrc=src; recalcAll(); renderForm(); persist();

async function prepGallery(file){
  const url=await fileToURL(file); const im=await readImg(url);
  const max=2000, sc=Math.min(1,max/Math.max(im.width,im.height)); const w=Math.round(im.width*sc), h=Math.round(im.height*sc);
  const c=document.createElement('canvas'); c.width=w; c.height=h; const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,w,h); g.drawImage(im,0,0,w,h);
  // обрезать белые поля
  const d=g.getImageData(0,0,w,h).data; let x0=w,y0=h,x1=-1,y1=-1;
  for(let y=0;y<h;y+=2) for(let x=0;x<w;x+=2){ const o=(y*w+x)*4; if(d[o]<242||d[o+1]<242||d[o+2]<242){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; } }
  let out=c;
  if (x1>x0&&y1>y0){ const pad=Math.round(Math.max(w,h)*0.01); x0=Math.max(0,x0-pad); y0=Math.max(0,y0-pad); x1=Math.min(w-1,x1+pad+1); y1=Math.min(h-1,y1+pad+1);
    out=document.createElement('canvas'); out.width=x1-x0+1; out.height=y1-y0+1; const og=out.getContext('2d'); og.fillStyle='#fff'; og.fillRect(0,0,out.width,out.height); og.drawImage(c,-x0,-y0); }
  const png = file.type==='image/png' || file.type==='image/gif' || file.type==='image/bmp';
  return { src: out.toDataURL(png?'image/png':'image/jpeg', 0.9), w: out.width, h: out.height };
}
async function addGallery(i, files, slot){

  if (!n) return toast('Нужен файл изображения: JPG, PNG, WEBP');

async function templatePack(id){

  const docX=await z.file('word/document.xml').async('string');
  const rels=(relsX.match(/<Relationship\s[^>]*\/>/g)||[]);
  const keep=rels.filter(x=>!/\/(image|hyperlink)"/.test(relAttr(x,'Type')) );
  const sects=docX.match(/<w:sectPr[\s\S]*?<\/w:sectPr>/g)||[];
  let sect=sects.length?sects[sects.length-1]:'';

  // нижний колонтитул: программа пишет свой в файл, на который ссылается шаблон, или добавляет новый
  let footerPath=null, addFooter=null;
  const fm=sect.match(/<w:footerReference[^>]*w:type="default"[^>]*\/>/);
  const fid=fm?relAttr(fm[0],'r:id'):'';
  const frel=fid&&keep.find(x=>relAttr(x,'Id')===fid);
  if (frel) footerPath='word/'+relAttr(frel,'Target').replace(/^\//,'').replace(/^word\//,'');
  else { footerPath='word/footer_kp.xml'; addFooter=true;
    keep.push('<Relationship Id="rIdKpFooter" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/footer" Target="footer_kp.xml"/>');
    sect=sect.replace(/<w:footerReference[^>]*w:type="default"[^>]*\/>/,'');
    sect=sect.replace(/(<w:sectPr[^>]*>(?:\s*<w:headerReference[^>]*\/>)*)/,'$1<w:footerReference w:type="default" r:id="rIdKpFooter"/>'); }
  const tpl={...j, rels:keep.join(''), sect};
  let clients=null;
  if (j.clientsImage){ try{ const buf=await (await fetch(`/tpl/${id}/${encodeURIComponent(j.clientsImage)}`)).arrayBuffer();
      const ext=/\.png$/i.test(j.clientsImage)?'png':'jpg'; const bmp=await createImageBitmap(new Blob([buf]));

  else tpl.clients=false;
  return TPL_CACHE[id]={base, tpl, footerPath, addFooter, clients};
}

function xlsColumns(t){
  const cols=[['name','Наименование'],['maker','Производитель'],['series','Серия'],['model','Модель'],['spec','Краткие характеристики']];
  for (const f of t.fields) cols.push([f.key, f.label+(f.unit?', '+f.unit:'')]);
  cols.push(['cost','Закупка за ед.'],['costCur','Валюта закупки (RUB/USD/EUR/CNY)'],['price','Цена продажи за ед., руб.'],['margin','Маржа, %']);
  return cols;
}
function parseTable(txt){
  txt=txt.replace(/^\uFEFF/,''); const first=txt.split(/\r?\n/)[0]||'';
  const sep = first.includes('\t') ? '\t' : (first.split(';').length>=first.split(',').length ? ';' : ',');
  const rows=[]; let row=[], cell='', q=false;
  for (let k=0;k<txt.length;k++){ const c=txt[k];
    if (q){ if (c==='"'){ if (txt[k+1]==='"'){ cell+='"'; k++; } else q=false; } else cell+=c; continue; }
    if (c==='"'){ q=true; continue; }
    if (c===sep){ row.push(cell); cell=''; continue; }
    if (c==='\n' || c==='\r'){ if (c==='\r'&&txt[k+1]==='\n') k++; row.push(cell); rows.push(row); row=[]; cell=''; continue; }
    cell+=c; }
  if (cell!==''||row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r=>r.some(c=>String(c).trim()!==''));
}

    for (const r of rows.slice(1)){
      const v={}; map.forEach((k,ix)=>{ if(k && String(r[ix]??'').trim()!=='') v[k]=String(r[ix]).trim(); });
      if (!v.name && !v.model){ skipped.push(r.join(' ').slice(0,40)); continue; }
      const attrs={cat:t.id}; for (const k of ['maker','series','model']) if (v[k]) attrs[k]=v[k];
      for (const f of t.fields) if (v[f.key]!=null){ attrs[f.key]= f.num ? (numOf(v[f.key])??v[f.key]) : v[f.key]; }
      const name=v.name || [t.item, v.maker, v.model].filter(Boolean).join(' ');
      const x={ id:(t.id+'_'+norm((v.maker||'')+' '+(v.model||name)).replace(/[^a-z0-9а-я]+/g,'')).slice(0,60).replace(/[^A-Za-z0-9_-]/g,c=>'x'+c.charCodeAt(0).toString(36)).slice(0,64),
        name, spec:v.spec||'', attrs, price:parsePrice(v.price||'')||0, priceCur:'RUB', cost:parsePrice(v.cost||'')||0, costCur:(v.costCur||'RUB').toUpperCase().slice(0,3),
        margin:v.margin?numOf(v.margin):undefined, features:[], groups:[], photo:null, logo:null, prices:[], updatedAt:new Date().toISOString(), pageTitle:name, photoCaption:'' };
      if (!CUR_LIST.includes(x.costCur)) x.costCur='RUB';
      x.groups=groupsFromAttrs(x); x.hint=autoHint(x); if(!x.spec) x.spec=mainLine(x,4);
      const ex=await fullDoc(catCache.find(z=>z.id===x.id)); if (ex){ x.photo=ex.photo; x.logo=ex.logo; x.prices=ex.prices||[]; if(!x.price) x.price=ex.price||0; if (ex.features&&ex.features.length) x.features=ex.features; }
      await store().put(x); n++;
    }
    await refreshCat(); d.close(); toast(`Импортировано позиций: ${n}${skipped.length?`, пропущено строк без наименования: ${skipped.length}`:''}`);
    openCatalog({cat:t.id});
  };
}

/* ---------- справочник типов оборудования ---------- */
function openTypesEditor(){
  const d=$('#dlg'); d.classList.add('wide');
  const userTypes=()=>{ const base=new Map(((TYPES_BUILTIN&&TYPES_BUILTIN.types)||[]).map(t=>[t.id,JSON.stringify(t)])); return TYPES.filter(t=>base.get(t.id)!==JSON.stringify(t)); };
  d.innerHTML=`<div class="dlg-h"><h3>Типы оборудования</h3><button class="icon" type="button" data-close aria-label="Закрыть">✕</button></div>
   <div class="dlg-b"><p class="muted" style="margin-top:0">Тип задаёт, какие параметры есть у оборудования, по каким из них работают фильтры каталога, что выводится на титуле и какие опции предлагаются. Добавить новый тип можно без программирования: нажмите «+ Новый тип» и поправьте поля по образцу.</p>
   <div class="tlist">${TYPES.map(t=>`<div class="trow"><b>${esc(t.name)}</b><span class="muted">${esc(t.group||'')} · ${t.fields.length} параметров · основной: ${esc((t.fields.find(f=>f.key===t.main)||{}).label||t.main||'—')}</span>
     <button class="btn ghost" type="button" data-tedit="${esc(t.id)}">Изменить</button></div>`).join('')}</div>
   <div class="row" style="margin-top:12px"><button class="btn" type="button" id="tNew">+ Новый тип</button><span style="flex:1"></span><button class="btn ghost" type="button" id="tReset">Вернуть стандартные типы</button></div>
   <div id="tEd"></div></div>`;
  d.showModal(); d.querySelector('[data-close]').onclick=()=>{ d.close(); d.classList.remove('wide'); };
  const save=async(list)=>{
    const payload={version:1,types:list};
    await api('/api/types',{method:'PUT',headers:{'Content-Type':'application/json; charset=utf-8'},body:JSON.stringify(payload)});
    await loadTypes(); catCache.forEach(x=>delete x._a); renderForm(); openTypesEditor(); toast('Справочник типов сохранён'); };
  const edit=(t)=>{
    $('#tEd').innerHTML=`<p class="sub" style="margin-top:16px">${esc(t.name||'Новый тип')}</p>
      <p class="muted">Формат JSON. <b>fields</b> — параметры: key (латиницей), label, unit, num (число), range (фильтр «от–до»), facet (фильтр-список), values (варианты), kpi (на титул), group (группа в таблице характеристик). <b>options</b> — быстрые опции: [«полное название», «кнопка», «шт. или усл.»].</p>
      <textarea id="tJson" rows="18" spellcheck="false" style="font-family:ui-monospace,Consolas,monospace;font-size:13px">${esc(JSON.stringify(t,null,2))}</textarea>
      <div class="row" style="margin-top:8px"><button class="btn primary" type="button" id="tSave">Сохранить тип</button>${t.id&&!((TYPES_BUILTIN&&TYPES_BUILTIN.types)||[]).some(b=>b.id===t.id)?'<button class="btn ghost" type="button" id="tDel">Удалить тип</button>':''}<span class="muted" id="tErr"></span></div>`;
    $('#tSave').onclick=async()=>{ let j; try{ j=JSON.parse($('#tJson').value); }catch(e){ $('#tErr').textContent='Ошибка в JSON: '+e.message; return; }
      if (!/^[a-z][a-z0-9_]{1,30}$/.test(j.id||'')) { $('#tErr').textContent='id — латиница, цифры и «_», начинается с буквы'; return; }
      if (!j.name || !Array.isArray(j.fields)) { $('#tErr').textContent='Нужны поля name и fields'; return; }
      if (j.fields.some(f=>!f.key||!f.label)) { $('#tErr').textContent='У каждого параметра нужны key и label'; return; }
      const list=userTypes().filter(x=>x.id!==j.id); list.push(j); await save(list); };
    const del=$('#tDel'); if (del) del.onclick=async()=>{ if(!confirm('Удалить тип? Позиции этого типа останутся в каталоге как «Прочее».')) return; await save(userTypes().filter(x=>x.id!==t.id)); };
    $('#tJson').focus(); };
  d.querySelector('.tlist').onclick=e=>{ const b=e.target.closest('[data-tedit]'); if(b) edit(typeById(b.dataset.tedit)); };
  $('#tNew').onclick=()=>edit({id:'new_type',group:'Компрессоры',name:'Новый тип',item:'Оборудование',coverTitle:'Оборудование',role:'equipment',main:'kw',match:'',
     fields:[{key:'kw',label:'Мощность',unit:'кВт',num:true,range:true,kpi:true,group:'Основные'}],options:[['Доставка до объекта','доставка','усл.']]});
  $('#tReset').onclick=async()=>{ if(!confirm('Удалить все свои изменения типов и вернуть стандартные?')) return; await save([]); };
}
/* ---------- журнал КП ---------- */
async function openJournal(){
  const d=$('#dlg');
  d.innerHTML=`<div class="dlg-h"><h3>Журнал КП</h3><button class="icon" type="button" data-close aria-label="Закрыть">✕</button></div>
   <div class="dlg-b"><input type="text" id="jQ" placeholder="Поиск по номеру, получателю или позиции" autocomplete="off" style="margin-bottom:8px"><div id="jList"><p class="empty">Загружаю…</p></div></div>`;
  d.showModal(); d.querySelector('[data-close]').onclick=()=>d.close();
  let rows=[]; try{ rows=await api('/api/history'); }catch(e){ $('#jList').innerHTML='<p class="empty">Журнал недоступен.</p>'; return; }
  rows.sort((a,b)=>String(b.number).localeCompare(String(a.number)));
  const draw=()=>{ const q=norm($('#jQ').value); const list=rows.filter(r=>!q||norm([r.number,r.client,(r.items||[]).join(' ')].join(' ')).includes(q));
    $('#jList').innerHTML = list.length ? list.map(r=>`<div class="jr"><div><span class="n">№ ${esc(r.number)}</span><div class="muted">${esc(KPGen.ruDate(r.date))}</div></div>
      <div><b>${esc(r.client)}</b><span class="muted">${money(r.sum||0)} руб. · ${r.positions||0} ${plural(r.positions||0,'позиция','позиции','позиций')}${(r.items&&r.items[0])?' · '+esc(r.items[0]):''}</span></div>
      <div class="acts"><button class="btn" type="button" data-jo="${esc(r.id)}">Открыть</button><button class="btn" type="button" data-jc="${esc(r.id)}">Копия</button><button class="btn" type="button" data-a="openDoc" data-id="${esc(r.id)}">${SRV.info&&SRV.info.local===false?'Скачать':'Word'}</button></div></div>`).join('')
      : `<p class="empty">${rows.length?'Ничего не найдено.':'Журнал пуст. Сохранённые КП появятся здесь.'}</p>`; };
  draw(); $('#jQ').oninput=draw;
  $('#jList').onclick=async e=>{
    const o=e.target.closest('[data-jo]'), c=e.target.closest('[data-jc]'); if(!o&&!c) return;
    try{
      const st=await api(`/api/kp/${(o||c).dataset[o?'jo':'jc']}/state`);
      S=Object.assign(freshState(), st);
      if (c){ delete S.kpId; delete S.number; S.date=today(); S.client=''; }
      d.close(); renderForm(); persist(); window.scrollTo({top:0});
      toast(c?'Создана копия — укажите получателя':'КП № '+S.number+' открыто для редактирования');
    }catch(err){ toast('Не удалось открыть КП'); }
  };
}

/* ---------- сборка DOCX ---------- */
async function download(){
  const msg=$('#dlmsg'); const btn=document.querySelector('[data-a="download"]');
  if (problems().length) return;
  if (!window.JSZip){ msg.className='msg err'; msg.textContent='Не загрузился модуль сборки файла. Обновите страницу.'; return; }
  btn.disabled=true; btn.textContent='Собираю файл…'; msg.textContent='';
  try{
    S.items.forEach(x=>(x.features||[]).forEach(featId));
    const St = JSON.parse(JSON.stringify(S, (k,v)=>k.startsWith('_')?undefined:v));
    St.vat=+S.vat; St.cur={code:kpCur(), rate:kpCur()!=='RUB'?rateOf(kpCur()):null, date:S.pricing.rateDate||''}; St.items=S.items.map(x=>({...x, qty:+x.qty, photo:undefined, logo:undefined, _srcImg:undefined, options:(x.options||[]).filter(o=>o.name.trim()&&+o.qty>0).map(o=>({name:o.name.trim(), short:o.short, unit:o.unit, qty:+o.qty, price:o.price||0}))}));
    if (!S.kpId){ const r=await api('/api/kp/new',{method:'POST'}); S.kpId=r.id; S.number=r.number; St.kpId=r.id; St.number=r.number; }
    if (!S.template) throw new Error('не выбран шаблон КП (папка templates рядом с программой пуста)');
    let pack;
    try{ pack=await templatePack(S.template); }catch(e){ throw new Error('шаблон «'+S.template+'» не загрузился: '+e.message); }
    const zip = await JSZip.loadAsync(pack.base);
    { if (pack.clients) zip.file('word/media/'+pack.clients.file, pack.clients.buf);
      if (pack.addFooter){ const ct=await zip.file('[Content_Types].xml').async('string');
        if (!ct.includes('/word/footer_kp.xml')) zip.file('[Content_Types].xml', ct.replace('</Types>','<Override PartName="/word/footer_kp.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.footer+xml"/></Types>')); }
      const ct=await zip.file('[Content_Types].xml').async('string');
      if (!/Extension="png"/i.test(ct) || !/Extension="jpg"/i.test(ct)) zip.file('[Content_Types].xml', ct.replace('<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">','<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'+(/Extension="png"/i.test(ct)?'':'<Default Extension="png" ContentType="image/png"/>')+(/Extension="jpg"/i.test(ct)?'':'<Default Extension="jpg" ContentType="image/jpeg"/>'))); }
    const Min={cover:null,items:{}};
    const STS=stationsOf();
    if (STS.length>=2){
      St.stations=STS.map(s=>({key:s.key,model:s.model,power:s.power,exec:s.exec,qty:s.qty}));
      Min.thumbs={};
      for (const s of STS){ if(!s.photo) continue; zip.file(`word/media/${s.key}.jpg`, b64(await toDataURL(s.photo)), {base64:true}); Min.thumbs[s.key]={file:`${s.key}.jpg`,w:s.photo.w,h:s.photo.h}; }
      if (!S.cover.touched){
        const makers=new Set(STS.map(s=>s.model.split(' ')[0]));
        const kvas=STS.filter(s=>/кВА/.test(s.power||'')).map(s=>parseFloat(String(s.power).replace(',','.'))).filter(x=>x>0);
        if (STS.length>3) St.cover.model = `${STS.length} ${plural(STS.length,'модель','модели','моделей')}` + (kvas.length && STS.every(s=>s.type==='dgu')?` · ${Math.min(...kvas)}–${Math.max(...kvas)} кВА`.replace(/\./g,','):'');
        else St.cover.model = makers.size===1 && STS.every(s=>s.model.startsWith('Tide Power ')) ? 'Tide Power '+STS.map(s=>s.model.replace('Tide Power ','')).join(' · ') : STS.map(s=>s.model).join(' · ');
        const cats=new Set(STS.map(s=>s.type)), grps=new Set(STS.map(s=>s.group));
        St.cover.title = cats.size===1 ? (typeById([...cats][0]).coverTitle||typeById([...cats][0]).name) : grps.size===1 ? [...grps][0] : 'Оборудование';
        St.cover.desc = `В предложение входят ${STS.length} ${plural(STS.length,'модель','модели','моделей')} оборудования. Характеристики каждой модели приведены на отдельной странице.`;
      }
    }
    const coverItem=S.items.find(x=>x.photo);
    if (coverItem){ zip.file('word/media/cover.jpg', b64(await toDataURL(coverItem.photo)), {base64:true}); Min.cover={file:'cover.jpg',w:coverItem.photo.w,h:coverItem.photo.h}; }
    for (const x of S.items){ if(!x.page) continue; const m={};
      if (x.photo){ const t=await tileFrom(x.photo); zip.file(`word/media/tile_${x.id}.png`, b64(t.url), {base64:true}); m.tile={file:`tile_${x.id}.png`,w:t.w,h:t.h}; }
      if (x.logo){ zip.file(`word/media/logo_${x.id}.png`, b64(await toDataURL(x.logo)), {base64:true}); m.logo={file:`logo_${x.id}.png`,w:x.logo.w,h:x.logo.h}; }
      m.gallery=[]; m.featImgs={}; let gk=0;
      (x.features||[]).forEach(featId);
      for (const g of (x.gallery||[])){ if (g.on===false) continue; const du=await toDataURL(g); if(!du) continue;
        const ext=/^data:image\/png/.test(du)?'png':'jpg'; const fnm=`gal_${x.id}_${++gk}.${ext}`;
        zip.file(`word/media/${fnm}`, b64(du), {base64:true});
        const L=linkOf(x,g);
        if (L.kind==='feat') m.featImgs[L.f.id]={file:fnm, w:g.w, h:g.h};
        else m.gallery.push({file:fnm, w:g.w, h:g.h, caption:(g.caption||'').trim() || (L.kind==='group'?L.name:''), wide:galWide(g)}); }
      Min.items[x.id]=m; }
    const out = KPGen.build(St, Min, ROOTS, pack.tpl);
    zip.file('word/document.xml', out.document); zip.file(pack.footerPath, out.footer); zip.file('word/_rels/document.xml.rels', out.rels);
    const blob = await zip.generateAsync({type:'blob', mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document', compression:'DEFLATE'});
    btn.textContent='Сохраняю в журнал…';
    await syncCatalog(S.number); await saveClient(true);
    for (const it of S.items){ it.photo=await uploadImg(it.photo); it.logo=await uploadImg(it.logo); if (it.gallery) for (const g of it.gallery){ const u=await uploadImg(g); if(u) g.src=u.src; } }
    const t=totals(S.items.map(x=>({qty:+x.qty||0,price:x.price||0})), +S.vat||0), fn=fileName();
    await api(`/api/kp/${S.kpId}/docx?name=${encodeURIComponent(fn)}&dir=${encodeURIComponent(managerFolder())}`,{method:'PUT',body:blob});
    const clean=JSON.parse(JSON.stringify(S,(k,v)=>k.startsWith('_')?undefined:v));
    await api(`/api/kp/${S.kpId}/state`,{method:'PUT',headers:{'Content-Type':'application/json; charset=utf-8'},body:JSON.stringify(clean)});
    const meta={ id:S.kpId, number:S.number, date:S.date, client:S.client, sum:t.sum, units:t.units, positions:S.items.length,
      items:S.items.map(x=>x.name).slice(0,3), file:fn, manager:S.manager.name, savedAt:new Date().toISOString() };
    await api(`/api/kp/${S.kpId}/meta`,{method:'PUT',headers:{'Content-Type':'application/json; charset=utf-8'},body:JSON.stringify(meta)});
    persist(); renderForm();
    const m2=$('#dlmsg'); m2.className='msg ok';
    m2.innerHTML=`КП № ${esc(S.number)} сохранено, каталог обновлён.<div class="row" style="justify-content:center;margin-top:8px"><button class="btn" type="button" data-a="openDoc" data-id="${esc(S.kpId)}">${SRV.info&&SRV.info.local===false?'Скачать .docx':'Открыть в Word'}</button>${SRV.info&&SRV.info.local===false&&!SRV.info.docsShare?'':`<button class="btn" type="button" data-a="showDoc" data-id="${esc(S.kpId)}">${SRV.info&&SRV.info.local===false?'Путь к файлу':'Показать в папке'}</button>`}</div>`;
  } catch(e){
    msg.className='msg err';
    msg.textContent = e&&e.code==='declined' ? 'Сохранение отменено.' : e&&e.code==='rate_limited' ? 'Окно сохранения уже открыто.' : 'Не удалось собрать файл: '+(e&&e.message||e);
  }
  btn.disabled=false; btn.textContent='Сохранить КП';
}
