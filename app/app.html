<style>
:root{
  --navy:#0B45A0; --sky:#3DA0EE; --ink:#1F2B4D; --muted:#66718C; --paper:#F3F6FB; --card:#FFFFFF;
  --line:#D9E6F3; --soft:#EAF4FD; --danger:#C23B22; --ok:#1E8E5A; --field:#FFFFFF; --panel:#0B2F6E; --panel-ink:#FFFFFF;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --ink:#E6ECF7; --muted:#9AA6BF; --paper:#0E1524; --card:#152036; --line:#26344F; --soft:#1A2A47; --field:#101a2e; --panel:#0B2F6E; --navy:#6FA8FF; --danger:#FF7A63; --ok:#4CC38A;
}}
:root[data-theme="dark"]{ --ink:#E6ECF7; --muted:#9AA6BF; --paper:#0E1524; --card:#152036; --line:#26344F; --soft:#1A2A47; --field:#101a2e; --panel:#0B2F6E; --navy:#6FA8FF; --danger:#FF7A63; --ok:#4CC38A; }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 "Onest",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
.top{display:flex;align-items:center;gap:16px;padding:14px 28px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.brand{font-weight:700;letter-spacing:.02em;font-size:17px}
.brand b{color:var(--navy)} .brand i{font-style:normal;color:var(--sky)}
.brand small{display:block;font-weight:500;letter-spacing:0;color:var(--muted);font-size:12.5px;margin-top:-2px}
.top .sp{flex:1}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;border:1.5px dashed var(--line);border-radius:12px;padding:12px;min-height:70px;background:var(--soft)}
.gal.over{border-color:var(--sky)}
.gcard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px}
.gcard img{width:100%;height:140px;object-fit:contain;background:#fff;border-radius:6px}
.gcard.off{opacity:.45}
.gctl{display:flex;gap:4px;align-items:center;flex-wrap:wrap}.gctl select{padding:6px 8px;font-size:13px;border-radius:8px;border:1px solid var(--line);background:var(--field);color:var(--ink);max-width:100%}
.chip.on{border-color:var(--ok);color:var(--ok)}
.cattabs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:14px}
.ctab{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13.5px;color:var(--ink)}
.ctab i{font-style:normal;color:var(--muted);font-size:12px;margin-left:2px}
.ctab.on{background:var(--navy);border-color:var(--navy);color:#fff}.ctab.on i{color:rgba(255,255,255,.8)}
.ctab.add{border-style:dashed;color:var(--navy)}
.cgrp{font-size:12px;color:var(--muted);margin-left:8px;font-weight:600}
.tag.tt{background:var(--soft);color:var(--navy)}
.tpick{display:flex;flex-wrap:wrap;gap:8px}
.tlist .trow{display:grid;grid-template-columns:260px 1fr auto;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
div.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);font-weight:500}
details.more{margin-top:12px;border:1px solid var(--line);border-radius:12px;padding:0 14px}
details.more>summary{cursor:pointer;padding:12px 0;font-weight:600;font-size:14px;color:var(--navy)}
details.more[open]>summary{border-bottom:1px solid var(--line);margin-bottom:4px}

      if (g.name) rows.push([tc(p(r(g.name, { sz: 14, color: BLUE, b: true, caps: true, sp: 20 })), wl[0] + wl[1], { span: 2, bdr: B(null, null, [6, SKY]), mar: [130, 120, 40, 120] })]);
      g.rows.forEach((row, i) => {
        const last = i === g.rows.length - 1;
        rows.push([cell(row.k, wl[0], { sz: 16, last }), cell(row.v, wl[1], { sz: 16, b: true, color: row.hl ? BLUE : DARK, last })]);
      });
    }
    return bgpara(wl[0] + wl[1], 380, NAVYD, 90) + tbl(rows, wl, { heights: { 0: 380 } });
  }

  // Дополнительные изображения: сетка карточек 2 в ряд, схемы и чертежи — на всю ширину.
  // Каждый ряд — отдельная неразрывная таблица: при нехватке места на странице переносится
  // ряд целиком (пустое место — не больше высоты одного ряда), заголовок держится с первым рядом.
  function galleryXml(list) {
    if (!list || !list.length) return '';
    const out = [spacer(300), heading('Узлы, фото и схемы')];
    const HALF = 5073, GAP = 201, FULL = W;
    const card = (g, w, boxW, boxH) => {
      const k = Math.min(boxW / g.w, boxH / g.h);
      const body = p(img(g.rid, Math.round(g.w * k), Math.round(g.h * k), g.caption || 'Изображение'), { jc: 'center', after: g.caption ? 80 : 0 }) +
        (g.caption ? p(r(g.caption, { sz: 16, b: true }), { jc: 'center', line: 240 }) : '');
      return tc(body, w, { bdr: B([4, HAIR], [4, HAIR], [4, HAIR], [4, HAIR]), va: 'center', mar: [140, 120, 140, 120] });
    };
    const halfBox = [(HALF - 260) * E, 2250000], fullBox = [(FULL - 260) * E, 3600000];
    // раскладка: половинки парами по порядку; широкое изображение, попавшее между половинками, ставится после пары
    const rows = []; let pend = null; const deferred = [];
    for (const g of list) {
      if (g.wide) { if (pend) deferred.push(g); else rows.push([g]); continue; }
      if (pend) { rows.push([pend, g]); pend = null; while (deferred.length) rows.push([deferred.shift()]); }
      else pend = g;
    }
    if (pend) rows.push([pend]);
    while (deferred.length) rows.push([deferred.shift()]);
    rows.forEach((row, n) => {
      if (n) out.push(spacer(160));
      if (row.length === 2) out.push(tbl([[card(row[0], HALF, ...halfBox), tc(END, GAP, { mar: [0, 0, 0, 0] }), card(row[1], HALF, ...halfBox)]], [HALF, GAP, HALF]));
      else if (row[0].wide) out.push(tbl([[card(row[0], FULL, ...fullBox)]], [FULL]));
      else { // одиночная половинка — по центру, без пустой колонки рядом
        const side = Math.floor((FULL - HALF) / 2);
        out.push(tbl([[tc(END, side, { mar: [0, 0, 0, 0] }), card(row[0], HALF, ...halfBox), tc(END, FULL - HALF - side, { mar: [0, 0, 0, 0] })]], [side, HALF, FULL - HALF - side]));
      }
    });
    return out.join('');
  }
  function equipXml(it, M) {
    const out = [heading(it.pageTitle || it.name, true)];
    const m = M.items[it.id] || {};
    let desc = '';
    if (m.logo) { const cx = 1350000, cy = Math.round(cx * m.logo.h / m.logo.w); desc += p(img(m.logo.rid, cx, Math.min(cy, 700000), 'Логотип'), { after: 160 }); }
    const feats = (it.features || []).filter(f => f.label || f.text);
    feats.forEach((f, i) => {
      if (f.label) desc += p(r(f.label, { sz: 14, color: BLUE, b: true, caps: true, sp: 15 }), { after: 20 });
      desc += p(r(f.text || '', { sz: 17 }), { after: i === feats.length - 1 ? 0 : 120, line: 250 });
    });
    const opts = (it.options || []).filter(o => o.name && +o.qty > 0);
    if (opts.length) {
      desc += p(r('Дополнительная комплектация', { sz: 14, color: BLUE, b: true, caps: true, sp: 15 }), { before: desc ? 160 : 0, after: 40 });
      opts.forEach(o => { desc += p(r('+ ' + o.name, { sz: 17 }), { after: 20, line: 250 }); });
    }
    if (m.tile) {
      const cx = 3180000, cy = Math.round(cx * m.tile.h / m.tile.w);
      const photo = tc(p(img(m.tile.rid, cx, cy, it.name), { jc: 'center', after: it.photoCaption ? 80 : 0 }) +
        (it.photoCaption ? p(r(it.photoCaption, { sz: 13, color: GRAY, caps: true, sp: 15 }), { jc: 'center' }) : ''), 5047, { mar: [0, 0, 0, 0] });
      if (desc) out.push(tbl([[tc(desc, 5000, { mar: [0, 0, 0, 200] }), tc(END, 300, { mar: [0, 0, 0, 0] }), photo]], [5000, 300, 5047]));
      else out.push(p(img(m.tile.rid, cx, cy, it.name), { jc: 'center' }));
    } else if (desc) out.push(desc);
    const groups = (it.groups || []).map(g => ({ name: g.name, rows: (g.rows || []).filter(x => x.k || x.v) })).filter(g => g.rows.length);
    if (groups.length) {
      out.push(spacer(300));
      out.push(heading('Технические характеристики'));
      const nrows = groups.reduce((a, g) => a + g.rows.length + 1, 0);
      if (nrows > 14) {
        // две колонки в одной «плоской» таблице: каждая строка независима, поэтому длинная таблица
        // аккуратно переносится на следующую страницу, не оставляя пустых мест
        const [L, R] = balance(groups);
        const flat = gs => gs.flatMap(g => [{ g: g.name }].concat(g.rows.map((row, i) => ({ k: row.k, v: row.v, hl: row.hl, last: i === g.rows.length - 1 }))));
        const a = flat(L), b = flat(R), n = Math.max(a.length, b.length);
        const wk = 2873, wv = 2200, gap = 201;
        const half = (e) => {
          if (!e) return [tc('', wk + wv, { span: 2, mar: [36, 120, 36, 120] })];
          if (e.g) return [tc(p(r(e.g, { sz: 14, color: BLUE, b: true, caps: true, sp: 20 })), wk + wv, { span: 2, bdr: B(null, null, [6, SKY]), mar: [130, 120, 40, 120] })];
          return [cell(e.k, wk, { sz: 16, last: e.last }), cell(e.v, wv, { sz: 16, b: true, color: e.hl ? BLUE : DARK, last: e.last })];
        };
        const rows = [[HDR('Параметр', wk), HDR('Значение', wv), tc(END, gap, { mar: [0, 0, 0, 0] }), HDR('Параметр', wk), HDR('Значение', wv)]];
        for (let i = 0; i < n; i++) rows.push([...half(a[i]), tc(END, gap, { mar: [0, 0, 0, 0] }), ...half(b[i])]);
        out.push(`<w:p><w:pPr><w:keepNext/><w:spacing w:before="0" w:after="0" w:line="20" w:lineRule="exact"/><w:rPr><w:sz w:val="2"/></w:rPr></w:pPr>${rbg(wk + wv, 380, NAVYD, 90, 20, 0)}${rbg(wk + wv, 380, NAVYD, 90, 20, wk + wv + gap)}</w:p>`);
        out.push(tbl(rows, [wk, wv, gap, wk, wv], { heights: { 0: 380 } }));
      } else out.push(specTable(groups, [6047, 4300]));
      out.push(p(r('Синим выделены ключевые параметры. Характеристики приведены по данным производителя.', { sz: 14, color: GRAY, i: true }), { before: 100 }));
    }
    out.push(galleryXml(m.gallery));
    return out.join('');
  }
  function kpXml(S) {
    const out = [heading('Коммерческое предложение', true)], t = totals(S.items, S.vat);
    const wc = [560, 4787, 1200, 1900, 1900], HL = B(null, null, [4, HAIR]), Mr = [230, 120, 230, 120];
    const rows = [[HDR('№', wc[0], 'center'), HDR('Наименование', wc[1]), HDR('Кол-во', wc[2], 'center'), HDR('Цена за ед., ' + curSh(S), wc[3], 'right'), HDR('Сумма, ' + curSh(S), wc[4], 'right')]];
    S.items.forEach((it, i) => {
      const nm = p(r(it.name, { sz: 19, b: true }), { after: it.spec ? 40 : 0 }) + (it.spec ? p(r(it.spec, { sz: 15, color: GRAY })) : '');
      rows.push([tc(p(r(String(i + 1), { sz: 18, color: GRAY }), { jc: 'center' }), wc[0], { bdr: HL, mar: Mr }), tc(nm, wc[1], { bdr: HL, mar: Mr }),
        tc(p(r(it.qty + NB + 'шт.', { sz: 18 }), { jc: 'center' }), wc[2], { bdr: HL, mar: Mr }),
        tc(p(r(money(it.price), { sz: 18 }), { jc: 'right' }), wc[3], { bdr: HL, mar: Mr }),
        tc(p(r(money(it.qty * it.price), { sz: 18, b: true }), { jc: 'right' }), wc[4], { bdr: HL, mar: Mr })]);
      (it.options || []).filter(o => o.name && +o.qty > 0).forEach((o, j) => {
        const Mo = [110, 120, 110, 120];
        const nm = p(r('+ ' + o.name, { sz: 17 }), { after: o.note ? 30 : 0, indL: 200 }) + (o.note ? p(r(o.note, { sz: 14, color: GRAY }), { indL: 200 }) : '');
        rows.push([tc(p(r(`${i + 1}.${j + 1}`, { sz: 15, color: GRAY }), { jc: 'center' }), wc[0], { bdr: HL, mar: Mo }), tc(nm, wc[1], { bdr: HL, mar: Mo }),
          tc(p(r(o.qty + NB + (o.unit || 'шт.'), { sz: 17 }), { jc: 'center' }), wc[2], { bdr: HL, mar: Mo }),
          tc(p(r(o.price ? money(o.price) : 'включено', { sz: 17, color: o.price ? DARK : GRAY }), { jc: 'right' }), wc[3], { bdr: HL, mar: Mo }),
          tc(p(r(o.price ? money(o.qty * o.price) : '—', { sz: 17, color: o.price ? DARK : GRAY }), { jc: 'right' }), wc[4], { bdr: HL, mar: Mo })]);
      });
    });
    const lbl = (tx, span, w) => tc(p(r(tx, { sz: 16, color: GRAY }), { jc: 'right' }), w, { span, mar: [90, 120, 60, 160] });
    rows.push([lbl('Итого', 2, wc[0] + wc[1]), tc(p(r(t.units + NB + 'шт.', { sz: 17, b: true }), { jc: 'center' }), wc[2], { mar: [90, 120, 60, 120] }),
      tc('', wc[3], { mar: [90, 120, 60, 120] }), tc(p(r(money(t.sum), { sz: 17, b: true }), { jc: 'right' }), wc[4], { mar: [90, 120, 60, 120] })]);
    rows.push([lbl(`в т. ч. НДС ${S.vat} %`, 4, wc[0] + wc[1] + wc[2] + wc[3]), tc(p(r(money(t.vat), { sz: 17 }), { jc: 'right' }), wc[4], { mar: [60, 120, 60, 120] })]);
    out.push(bgpara(W, 440, NAVYD, 90));
    out.push(tbl(rows, wc, { heights: { 0: 440 }, header: true }));
    const L4 = wc[0] + wc[1] + wc[2] + wc[3];
    out.push(bgpara(W, 640, BLUE, 120, 120));
    out.push(tbl([[tc(p(r(`Итого к оплате с НДС`, { sz: 18, color: 'FFFFFF', b: true, caps: true, sp: 15 }), { jc: 'right' }), L4, { mar: [0, 120, 0, 160] }),
      tc(p(r(money(t.sum), { sz: 24, color: 'FFFFFF', b: true }), { jc: 'right' }), wc[4], { mar: [0, 120, 0, 120] })]], [L4, wc[4]], { heights: { 0: 640 } }));
    out.push(p(r('Итого: ', { sz: 15, b: true }) + r(`${words(t.sum, curCode(S))}, в т. ч. НДС ${S.vat} % — ${money(t.vat)} ${curSh(S)}`, { sz: 15 }), { before: 140, line: 250 }));
    if (curCode(S) !== 'RUB') {
      const C = CURS[curCode(S)], rt = S.cur && +S.cur.rate;
      const eq = rt ? Math.round(t.sum * rt) : 0;
      out.push(p(r(`Цены указаны в ${C.name}. Оплата производится в рублях по курсу ЦБ РФ на дату оплаты.` +
        (rt ? ` Справочно: курс ЦБ РФ${S.cur.date ? ' на ' + ruDate(S.cur.date) : ''} — 1 ${C.sh} = ${String(rt).replace('.', ',')} руб.; сумма в рублях — ${money(eq)} руб.` : ''), { sz: 15, color: GRAY, i: true }), { before: 60, line: 250 }));
    }
    const conds = (S.conditions || []).filter(c => c.value);
    if (conds.length) {
      out.push(spacer(480));
      out.push(heading('Условия предложения'));
      out.push(tbl(conds.map((c, i) => {
        const bd = i === conds.length - 1 ? B() : B(null, null, [4, HAIR]);
        return [tc(p(r(c.label, { sz: 18, color: GRAY })), 3400, { bdr: bd, mar: [130, 120, 130, 120] }), tc(p(r(c.value, { sz: 18 })), 6947, { bdr: bd, mar: [130, 120, 130, 120] })];
      }), [3400, 6947]));
    }
    out.push(spacer(520));
    out.push(heading('Контактная информация'));
    const m = S.manager;
    const LBL = tx => p(r(tx, { sz: 14, color: GRAY, b: true, caps: true, sp: 20 }), { after: 50 });
    const ch = (lab, val, w, first, lastRow) => tc(LBL(lab) + p(val, { line: 240 }), w, { bdr: B([4, LINE]), va: 'top', mar: [200, first ? 0 : 200, lastRow ? 40 : 200, 120] });
    const top = tbl([[tc(p(r(m.name, { sz: 30, color: BLUE, b: true }), { after: 60, line: 240 }) + p(r(m.position || '', { sz: 19 }), { line: 250 }), 6400, { va: 'bottom', mar: [0, 0, 220, 0] }),
      tc(p(r('С уважением и надеждой', { sz: 17, color: GRAY, i: true }), { jc: 'right', line: 250 }) + p(r('на плодотворное сотрудничество', { sz: 17, color: GRAY, i: true }), { jc: 'right', line: 250 }), 3347, { va: 'bottom', mar: [0, 0, 220, 0] })]], [6400, 3347]);
    const cw = [3149, 3149, 3449];
    const phone = r(m.phone || '', { sz: 22, b: true }) + (m.ext ? r(' доб. ' + m.ext, { sz: 19, color: GRAY }) : '');
    const grid = tbl([[ch('Телефон', phone, cw[0], true), ch('Мобильный', r(m.mobile || '—', { sz: 22, b: true }), cw[1]),
      ch('E-mail', m.email ? hyper('rIdMail', r(m.email, { sz: 20, color: BLUE, b: true })) : r('—', { sz: 20 }), cw[2])],
    [ch('Сайт', m.site ? hyper('rIdSite', r(m.site, { sz: 20, color: BLUE, b: true })) : r('—', { sz: 20 }), cw[0], true, true),
      ch('Часы работы', r(m.hours || '—', { sz: 20 }), cw[1], false, true), ch('Адрес', r(m.address || '—', { sz: 20 }), cw[2], false, true)]], cw);
    out.push(bgpara(W, 3420, LIGHT, 180));
    out.push(tbl([[tc(top + grid + END, W, { va: 'top', mar: [340, 340, 200, 340] })]], [W], { heights: { 0: 3420 } }));
    return out.join('');
  }

  const SECT = '<w:sectPr><w:headerReference w:type="default" r:id="rId13"/><w:footerReference w:type="default" r:id="rId14"/><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1418" w:right="850" w:bottom="1020" w:left="709" w:header="142" w:footer="454" w:gutter="0"/><w:cols w:space="708"/><w:docGrid w:linePitch="360"/></w:sectPr>';

  function fld(instr, res, o) {
    const rp = `<w:rPr><w:rFonts w:ascii="Arial" w:hAnsi="Arial" w:cs="Arial"/>${o.b ? '<w:b/>' : ''}<w:color w:val="${o.color}"/><w:sz w:val="${o.sz}"/><w:szCs w:val="${o.sz}"/></w:rPr>`;
    return `<w:r>${rp}<w:fldChar w:fldCharType="begin"/></w:r><w:r>${rp}<w:instrText xml:space="preserve"> ${instr} </w:instrText></w:r><w:r>${rp}<w:fldChar w:fldCharType="separate"/></w:r><w:r>${rp}<w:t>${res}</w:t></w:r><w:r>${rp}<w:fldChar w:fldCharType="end"/></w:r>`;
  }
  function footerXml(S, root) {
    const TOP = line('top', 4, LINE) + '<w:left w:val="nil"/><w:bottom w:val="nil"/><w:right w:val="nil"/>';
    const left = p(r('ПНЕВМО', { sz: 15, color: BLUE, b: true }) + r('ТЕХ', { sz: 15, color: SKY, b: true }) +
      r('   ·   Технико-коммерческое предложение для ', { sz: 14, color: GRAY }) + r(S.client, { sz: 14, b: true }));
    const right = p(r('www.kompr.ru   ·   ', { sz: 14, color: GRAY }) + fld('PAGE', '1', { sz: 16, color: BLUE, b: true }) + r(' / ', { sz: 14, color: GRAY }) + fld('NUMPAGES', '1', { sz: 14, color: GRAY }), { jc: 'right' });
    return root + tbl([[tc(left, 6847, { bdr: TOP, mar: [110, 0, 0, 0] }), tc(right, 3500, { bdr: TOP, mar: [110, 0, 0, 0] })]], [6847, 3500]) + END + '</w:ftr>';
  }

  function relsXml(S, media) {
    const R = (id, type, target, ext) => `<Relationship Id="${id}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/${type}" Target="${esc(target)}"${ext ? ' TargetMode="External"' : ''}/>`;
    let x = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      R('rId1', 'customXml', '../customXml/item1.xml') + R('rId2', 'numbering', 'numbering.xml') + R('rId3', 'styles', 'styles.xml') + R('rId4', 'settings', 'settings.xml') +
      R('rId5', 'webSettings', 'webSettings.xml') + R('rId6', 'footnotes', 'footnotes.xml') + R('rId7', 'endnotes', 'endnotes.xml') + R('rId8', 'image', 'media/image1.jpeg') +
      R('rId13', 'header', 'header1.xml') + R('rId14', 'footer', 'footer1.xml') + R('rId15', 'fontTable', 'fontTable.xml') + R('rId16', 'theme', 'theme/theme1.xml');
    const m = S.manager;
    if (m.email) x += R('rIdMail', 'hyperlink', 'mailto:' + m.email.trim(), true);
    if (m.site) x += R('rIdSite', 'hyperlink', /^https?:/i.test(m.site) ? m.site.trim() : 'http://' + m.site.trim(), true);
    media.forEach(md => { x += R(md.rid, 'image', 'media/' + md.file); });
    return x + '</Relationships>';
  }

  /* S — состояние формы; M — подготовленные изображения:
     { cover:{file,w,h}, items:{[id]:{tile:{file,w,h}, logo:{file,w,h}}} }  */
  function build(S, Min, roots) {
    PID = 9000;
    const media = [], M = { cover: null, items: {} };
    let n = 0;
    const reg = x => { if (!x) return null; const rid = 'rIdImg' + (++n); media.push({ rid, file: x.file }); return Object.assign({ rid }, x); };
    M.cover = reg(Min.cover);
    M.thumbs = {}; for (const k in (Min.thumbs || {})) M.thumbs[k] = reg(Min.thumbs[k]);
    for (const id in (Min.items || {})) M.items[id] = { tile: reg(Min.items[id].tile), logo: reg(Min.items[id].logo), gallery: (Min.items[id].gallery || []).map(reg).filter(Boolean) };
    let body = coverXml(S, M);
    if (S.showClients) body += heading('Наши клиенты', true) + LOGOS;
    for (const it of S.items) if (it.page && ((it.options || []).some(o => o.name) || it.groups?.some(g => g.rows?.some(x => x.k || x.v)) || M.items[it.id]?.tile || (M.items[it.id]?.gallery || []).length || (it.features || []).some(f => f.text))) body += equipXml(it, M);
    body += kpXml(S);
    return {
      document: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' + roots.document + '<w:body>' + body + SECT + '</w:body></w:document>',
      footer: footerXml(S, roots.footer),
      rels: relsXml(S, media),
      media
    };
  }

  root.KPGen = { build, money, words, totals, ruDate, plural, CURS };
})(typeof window !== 'undefined' ? window : globalThis);

  const a=attrsOf(x), t=typeById(a.cat), G=new Map();
  const add=(g,k,v,hl)=>{ if(!v) return; if(!G.has(g)) G.set(g,[]); G.get(g).push({k,v,hl:!!hl}); };
  add('Основные','Производитель',a.maker); add('Основные','Модель',a.model);
  for (const f of t.fields){ const v=fmtField(f,a[f.key]); add(f.group||'Основные', f.label, v, f.kpi); }
  return [...G.entries()].map(([name,rows])=>({name,rows}));
}

const EXEC = ['Открытое','В кожухе','Блок-контейнер','На шасси','Кожух на шасси','Контейнер на шасси'];
function kwIn(s){ const m=String(s||'').replace(/\u00A0/g,' ').match(/(\d+(?:[.,]\d+)?)\s*кВт/i); return m?+m[1].replace(',','.'):null; }
function kvaIn(s){ const m=String(s||'').replace(/\u00A0/g,' ').match(/(\d+(?:[.,]\d+)?)\s*кВА/i); return m?+m[1].replace(',','.'):null; }
const brand = s => String(s||'').split(/[\/,;(]| - | — /)[0].trim().split(/\s+/)[0] || '';
function extractAttrs(d){
  const rows=(d.groups||[]).flatMap(g=>(g.rows||[]).map(r=>({g:norm(g.name),k:norm(r.k),v:String(r.v||'').trim()})));
  const find=(re,gre)=>rows.find(r=>re.test(r.k)&&(!gre||gre.test(r.g)));
  const feat=re=>(d.features||[]).find(f=>re.test(norm(f.label)));
  const text=[d.name,d.spec,d.pageTitle,d.photoCaption,...(d.features||[]).map(f=>f.label+' '+f.text)].join(' ');
  const a={};
  a.type = d.kind==='option' ? 'Опция' : /(^|\s)авр|автоматическ\S* ввод/i.test(d.name||'') ? 'Шкаф АВР' : /генератор|дгу|электростанц|дэс/i.test(text) ? 'ДГУ' : 'Прочее';
  const mk=((d.hint&&d.hint.model)||d.name||'').match(/\b([A-Z]{3,})\b/); a.maker = mk?mk[1]:'';
  const md=(d.name||'').match(/\b(HG\s*\d+\s*[A-ZА-Яа-я_]{0,4})/i); a.model = md?md[1].replace(/\s+/g,' ').trim():'';
  const sr=a.model.match(/\d+\s*([A-ZА-Я_]+)/i); a.series = sr?sr[1].toUpperCase().replace(/В/g,'B').replace(/С/g,'C').replace(/А/g,'A').replace(/_A$/,''):'';
  let e = find(/марка|модель|производител/, /двигател/) || find(/двигател/); let ev = e?e.v:(feat(/двигател/)?.text||'');
  a.engine = brand(ev); a.engineModel = e&&/\//.test(e.v) ? e.v.split('/')[1].trim() : '';
  let al = find(/марка|модель|производител/, /альтернатор|генератор перем/) || find(/альтернатор/); let av = al?al.v:(feat(/альтернатор/)?.text||'');
  a.alternator = brand(av);
  const c = find(/панель|контроллер/) ; a.controller = c ? c.v.split(/[,;(]/)[0].trim() : (feat(/панель|контроллер/)?.text||'').split(/[—,.]/)[0].trim();
  const pr = find(/номинальн|основн|prime|длительн/); const sb = find(/максимальн|резервн|standby|аварийн/);
  a.kw = kwIn(pr&&pr.v) ?? kwIn(d.spec) ?? kwIn(d.name) ?? null;
  a.kwMax = kwIn(sb&&sb.v) ?? null;
  a.kva = kvaIn(pr&&pr.v) ?? kvaIn(d.spec) ?? null;
  const t=norm(text);
  a.execution = /контейнер/.test(t)&&/шасси|прицеп/.test(t) ? 'Контейнер на шасси' : /кожух/.test(t)&&/шасси|прицеп/.test(t) ? 'Кожух на шасси' : /контейнер/.test(t) ? 'Блок-контейнер' : /шасси|прицеп/.test(t) ? 'На шасси' : /кожух/.test(t) ? 'В кожухе' : /открыт|на раме/.test(t) ? 'Открытое' : '';
  const v=find(/напряжен/); a.voltage = v?v.v:'';
  if (a.type!=='ДГУ'){ const amp=(d.name||'').match(/(\d+)\s*А\b/); if(amp) a.amps=+amp[1]; }
  return a;
}

/* ---------- локальное хранилище каталога (IndexedDB, запасной вариант — память) ---------- */
const Cat = (()=>{
  let dbp=null, mem=new Map(), ok=true;
  function open(){ if(dbp) return dbp; dbp=new Promise((res)=>{ try{ const rq=indexedDB.open('kp-catalog',1);
      rq.onupgradeneeded=()=>rq.result.createObjectStore('items',{keyPath:'id'}); rq.onsuccess=()=>res(rq.result); rq.onerror=()=>{ok=false;res(null);}; }catch(e){ ok=false; res(null);} }); return dbp; }
  async function tx(mode, fn){ const db=await open(); if(!db) return null; return new Promise((res,rej)=>{ const t=db.transaction('items',mode); const st=t.objectStore('items'); const r=fn(st); t.oncomplete=()=>res(r&&r.result); t.onerror=()=>rej(t.error); }); }
  return {
    get persistent(){ return ok; },
    async list(){ const r=await tx('readonly',st=>st.getAll()); return r || [...mem.values()]; },
    async put(doc){ const r=await tx('readwrite',st=>st.put(doc)); if(r===null) mem.set(doc.id,doc); },
    async del(id){ const r=await tx('readwrite',st=>st.delete(id)); if(r===null) mem.delete(id); }
  };
})();

async function api(path, opts={}){
  const r = await fetch(path, opts);
  if (!r.ok) throw new Error((await r.text()) || ('HTTP '+r.status));
  const ct = r.headers.get('content-type')||''; return ct.includes('json') ? r.json() : r.text();
}
async function dataURLtoBlobAsync(u){ return (await fetch(u)).blob(); }
async function uploadImg(img){
  if (!img || !SRV.on || !String(img.src).startsWith('data:')) return img;
  const ext = img.src.startsWith('data:image/png') ? 'png' : 'jpg';
  const r = await api('/api/img?ext='+ext, {method:'POST', body: await dataURLtoBlobAsync(img.src)});
  return { src:'/img/'+r.name, w:img.w, h:img.h };
}

    await api('/api/catalog/'+doc.id,{method:'PUT',headers:{'Content-Type':'application/json; charset=utf-8'},body:JSON.stringify(doc)}); return doc; },
  async del(id){ await api('/api/catalog/'+id,{method:'DELETE'}); } };

    features:JSON.parse(JSON.stringify(x.features||[])), groups:JSON.parse(JSON.stringify(x.groups||[])), hint:x.hint||null, catId:x.id, photo:x.photo||null, logo:x.logo||null,
    attrs:{...(x.attrs||{})}, options:JSON.parse(JSON.stringify(x.options||[])).map(o=>({...o,id:uid(),qty:o.unit==='усл.'?1:(+it.qty||1)})) });
  delete it._priceText; delete it._costText;
  it.cost=x.cost||0; it.costCur=x.costCur||'RUB'; it.margin=x.margin; it.priceManual=false;
  const pc=x.priceCur||'RUB';

async function syncCatalog(number){
  let list=[]; try{ list = await store().list(); }catch(e){}
  for (const it of S.items){
    if (!it.name.trim() || !it.price) continue;
    const doc = list.find(d=>d.id===it.catId) || list.find(d=>norm(d.name)===norm(it.name));
    const base = doc ? JSON.parse(JSON.stringify(doc)) : { id: uid()+uid(), prices: [] };
    const has = arr => Array.isArray(arr) && arr.length;
    Object.assign(base, { name:it.name, spec:it.spec||base.spec||'', price:it.price, priceCur:kpCur(), cost:it.cost||base.cost||0, costCur:it.cost?(it.costCur||'RUB'):(base.costCur||'RUB'), margin:it.margin ?? base.margin, pageTitle:it.pageTitle||base.pageTitle||'',
      photoCaption:it.photoCaption||base.photoCaption||'',
      features: (it.features||[]).some(f=>f.text) ? it.features : (base.features||[]),
      groups: (it.groups||[]).some(g=>(g.rows||[]).some(r=>r.k||r.v)) ? it.groups : (base.groups||[]),
      hint: it.hint||base.hint||null, photo: it.photo||base.photo||null, logo: it.logo||base.logo||null, gallery: (it.gallery&&it.gallery.length)?it.gallery.map(({id,src,w,h,caption,slot,wide,on})=>({id,src,w,h,caption,slot,wide,on})):(base.gallery||[]), updatedAt: new Date().toISOString(),
      attrs: {...(base.attrs||{}), ...Object.fromEntries(Object.entries(it.attrs||{}).filter(([,v])=>v!==''&&v!=null))} });
    if (!base.kind && attrsOf(base).type==='Опция') base.kind='option';
    base.prices = (base.prices||[]).filter(p => !number || p.number!==number);
    base.prices.unshift({ date:S.date, client:S.client, price:it.price, cur:kpCur(), cost:it.cost||0, costCur:it.costCur||'RUB', qty:+it.qty, number:number||'' });
    base.prices = base.prices.slice(0,50);
    const saved = await store().put(base);
    it.catId = base.id;
    if (saved){ if (saved.photo) it.photo = saved.photo; if (saved.logo) it.logo = saved.logo; if (saved.gallery && it.gallery && saved.gallery.length===it.gallery.length) it.gallery=it.gallery.map((g,k)=>({...g, src:saved.gallery[k].src})); }
    for (const o of (it.options||[])){
      if (!o.name.trim() || !o.price) continue;
      const od = list.find(d=>d.id===o.catId) || list.find(d=>norm(d.name)===norm(o.name));
      const ob = od ? JSON.parse(JSON.stringify(od)) : { id: uid()+uid(), kind:'option', prices: [], features:[], groups:[] };
      if (!od && !allPresets().some(p=>norm(p.name)===norm(o.name)) && !/авр|автоматическ/i.test(o.name)) ob.kind='option';
      Object.assign(ob,{ name:o.name, price:o.price, spec:ob.spec||'', updatedAt:new Date().toISOString(), short:o.short||ob.short||'', unit:o.unit||'шт.' });
      if (!od && allPresets().some(p=>norm(p.name)===norm(o.name))) ob.kind='option';
      ob.prices=(ob.prices||[]).filter(p=>!number||p.number!==number); ob.prices.unshift({date:S.date,client:S.client,price:o.price,qty:+o.qty,number:number||''}); ob.prices=ob.prices.slice(0,50);
      await store().put(ob); o.catId=ob.id; list.push(ob);
    }
  }
  await refreshCat();
}

function parsePrice(s){
  s = String(s||'').replace(/[\s\u00A0]/g,'').replace(',', '.');
  if (!s) return 0;
  if (!/^\d+(\.\d{0,2})?$/.test(s)) return NaN;
  const [a,b=''] = s.split('.'); return (+a)*100 + (+(b+'00').slice(0,2));
}
const fmtPrice = k => k ? money(k) : '';

  if (/^st-client/.test(t)) return 'client';
  if (/^st-price|^prow-/.test(t) || /курс|закупк|: укажите цену/i.test(msg)) return 'price';

  return `<div class="item" id="item-${x.id}">
   <div class="item-head">
     <div class="item-no" aria-hidden="true">${i+1}</div>
     <label class="f"><span class="req">Наименование</span><input type="text" data-p="${P}.name" value="${esc(x.name)}" placeholder="Начните вводить — подскажу из каталога" autocomplete="off" list="catNames"></label>
     <label class="f qtyc"><span class="req">Кол-во, шт.</span><div class="qty"><button type="button" data-a="qty" data-i="${i}" data-d="-1" aria-label="Меньше">−</button><input type="text" inputmode="numeric" data-p="${P}.qty" value="${esc(x.qty)}" class="${+x.qty>=1&&Number.isInteger(+x.qty)?'':'bad'}"><button type="button" data-a="qty" data-i="${i}" data-d="1" aria-label="Больше">+</button></div></label>
     <div class="f pricec"><span>Цена за ед., ${curSh(kpCur())}</span><button type="button" class="pricebox${x.price?'':' empty'}" data-a="toPrice" title="Цена задаётся в разделе «Цены и валюта»">${x.price?fmtPrice(x.price):'задать цену'}</button></div>
     <div class="row acts">
       <button class="icon" type="button" data-a="up" data-i="${i}" aria-label="Выше" ${i===0?'disabled':''}>↑</button>
       <button class="icon" type="button" data-a="down" data-i="${i}" aria-label="Ниже" ${i===S.items.length-1?'disabled':''}>↓</button>
       <button class="icon" type="button" data-a="delItem" data-i="${i}" aria-label="Удалить позицию">✕</button>
     </div>
   </div>
   <div class="grid" style="margin-top:10px">${field('Краткие характеристики (строка под названием в таблице)',`${P}.spec`,{ph:'Двигатель · альтернатор · мощность · габариты'})}</div>
   <div class="item-sum"><button class="sw" type="button" role="switch" aria-checked="${!!x.page}" data-a="togglePage" data-i="${i}"><i></i>Страница оборудования в КП</button>
     <span>Сумма: <b data-sum="${i}">${money(itemSum(x))}</b> ${curSh(kpCur())}</span></div>

  </div>`;

function itemSum(x){ return (+x.qty||0)*(x.price||0) + (x.options||[]).reduce((s,o)=>s+(+o.qty||0)*(o.price||0),0); }
function optsBlock(x,i){
  const P=`items.${i}`, opts=x.options||[];
  const rows = opts.map((o,j)=>{ const pt=o._priceText ?? (o.price?money(o.price):'');
    return `<div class="opt"><input type="text" data-p="${P}.options.${j}.name" value="${esc(o.name)}" placeholder="Наименование опции или услуги" list="optNames" autocomplete="off" aria-label="Опция">
    <input type="text" inputmode="numeric" data-p="${P}.options.${j}.qty" value="${esc(o.qty)}" class="${+o.qty>=1?'':'bad'}" aria-label="Количество" title="Количество, ${esc(o.unit||'шт.')}">
    <input type="text" inputmode="decimal" class="num${Number.isNaN(parsePrice(pt))?' bad':''}" data-oprice="${i}.${j}" value="${esc(pt)}" placeholder="включено" aria-label="Цена за единицу">
    <span class="s" data-osum="${i}.${j}">${o.price?money((+o.qty||0)*o.price):'—'}</span>
    <button class="icon" type="button" data-a="delOpt" data-i="${i}" data-j="${j}" aria-label="Удалить опцию">✕</button></div>`; }).join('');
  const have=new Set(opts.map(o=>norm(o.name)));
  const PR=presetsFor(x);
  const chips=PR.map((p,k)=>`<button class="chip${have.has(norm(p.name))?' on':''}" type="button" data-a="optPreset" data-i="${i}" data-k="${k}" aria-pressed="${have.has(norm(p.name))}">${esc(p.short)}</button>`).join('');
  return `<div class="opts"><p class="sub">Дополнительное оборудование и услуги ${opts.length?`<span class="muted">${opts.length} ${plural(opts.length,'опция','опции','опций')}</span>`:''}</p>
   <div class="chips">${chips}</div>${rows}
   <div class="row"><button class="btn ghost" type="button" data-a="addOpt" data-i="${i}">+ своя опция</button>
   ${opts.length?'<span class="muted">Пустая цена — «включено в стоимость».</span>':''}</div></div>`;
}
function attrsBlock(x,i){
  const P=`items.${i}.attrs`, a=x.attrs||{}, auto=attrsOf(x), cat=auto.cat, t=typeById(cat);

}

/* ---------- боковая панель ---------- */
function totalsS(){ return totals(S.items.map(x=>({qty:+x.qty||0, price:x.price||0, options:(x.options||[]).filter(o=>o.name).map(o=>({qty:+o.qty||0, price:o.price||0}))})), +S.vat||0); }
function problems(){
  const p=[];
  if (!S.client.trim()) p.push(['Укажите получателя','st-client']);
  if (!S.date) p.push(['Укажите дату','st-client']);
  if (!S.items.length) p.push(['Добавьте хотя бы одну позицию','st-items']);
  S.items.forEach((x,i)=>{
    if (!x.name.trim()) p.push([`Позиция ${i+1}: нет наименования`,'item-'+x.id]);
    if (!(Number.isInteger(+x.qty) && +x.qty>=1)) p.push([`Позиция ${i+1}: количество — целое число от 1`,'item-'+x.id]);
    if (!x.price || Number.isNaN(parsePrice(x._priceText ?? fmtPrice(x.price)))) p.push([`Позиция ${i+1}: укажите цену`,'prow-'+x.id]);
    (x.options||[]).forEach((o,j)=>{ if(!o.name.trim()) return;
      if (!(Number.isInteger(+o.qty)&&+o.qty>=1)) p.push([`Позиция ${i+1}, опция «${o.short||o.name}»: количество`,'item-'+x.id]);
      if (Number.isNaN(parsePrice(o._priceText ?? ''))) p.push([`Позиция ${i+1}, опция «${o.short||o.name}»: цена`,'item-'+x.id]); });
  });
  if (!S.cover.model.trim() && stationsOf().length<2) p.push(['Титул: укажите модель или серию','st-cover']);
  const v=+S.vat; if (!(v>=0 && v<=50)) p.push(['Проверьте ставку НДС','st-conds']);
  const needR=new Set([kpCur(),...S.items.filter(x=>x.cost).map(x=>x.costCur||'RUB')].filter(c=>c!=='RUB'));
  for (const c of needR) if (!(rateOf(c)>0)) p.push([`Укажите курс ${c}`,'st-price']);
  if (!S.manager.name.trim() || !S.manager.phone.trim()) p.push(['Контакты: ФИО и телефон','st-manager']);
  return p;
}
function fileName(){
  const c = (S.client||'клиент').replace(/[«»"'\\/:*?<>|]/g,'').replace(/^(ООО|АО|ПАО|ЗАО|ИП|ОАО)\s+/i,'').trim().replace(/\s+/g,'_').slice(0,40) || 'клиент';
  return (S.number?S.number+'_':'')+`КП_Пневмотех_${c}_${S.date||today()}.docx`;
}
function renderSide(){
  const t = totalsS();
  const pr = problems();
  const cs=curSh(kpCur());
  const mt=$('#mtotal'); if(mt) mt.textContent=money(t.sum)+' '+cs;
  const withCost=S.items.filter(x=>x.cost && costKP(x)>0);
  const costSum=withCost.reduce((s,x)=>s+costKP(x)*(+x.qty||0),0), saleSum=withCost.reduce((s,x)=>s+(x.price||0)*(+x.qty||0),0);
  const mBlock = withCost.length ? `<div class="mrg"><div class="lab">Для внутреннего расчёта — в КП не выводится</div><dl>
     <dt>Закупка${withCost.length<S.items.length?` (${withCost.length} из ${S.items.length} поз.)`:''}</dt><dd>${money(Math.round(costSum))} ${cs}</dd>
     <dt>Продажа тех же позиций</dt><dd>${money(saleSum)} ${cs}</dd>

function pickImage(kind,i){ const f=$('#filePick'); f.value=''; f.onchange=()=>f.files[0]&&loadImage(f.files[0],kind,i); f.click(); }
function readImg(src){ return new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=rej; im.src=src; }); }
function fileToURL(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); }); }
async function prepImage(src, kind){
  const im=await readImg(src); const max=1600, sc=Math.min(1, max/Math.max(im.width,im.height));
  let w=Math.round(im.width*sc), h=Math.round(im.height*sc);
  const c=document.createElement('canvas'); c.width=w; c.height=h; const g=c.getContext('2d'); g.drawImage(im,0,0,w,h);
  // обрезка белых/прозрачных полей
  const d=g.getImageData(0,0,w,h).data; let x0=w,y0=h,x1=-1,y1=-1;
  for(let y=0;y<h;y+=1) for(let x=0;x<w;x+=1){ const o=(y*w+x)*4; if (d[o+3]>20 && (d[o]<240||d[o+1]<240||d[o+2]<240)){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; } }
  let out=c;
  if (x1>x0 && y1>y0){ const pad=Math.round(Math.max(w,h)*0.015); x0=Math.max(0,x0-pad); y0=Math.max(0,y0-pad); x1=Math.min(w-1,x1+pad); y1=Math.min(h-1,y1+pad);
    out=document.createElement('canvas'); out.width=x1-x0+1; out.height=y1-y0+1; const og=out.getContext('2d');
    if (kind!=='logo'){ og.fillStyle='#fff'; og.fillRect(0,0,out.width,out.height); }
    og.drawImage(c,-x0,-y0); }
  const type = kind==='logo' ? 'image/png' : 'image/jpeg';
  return { src: out.toDataURL(type, 0.9), w: out.width, h: out.height };
}
async function loadImage(file, kind, i){
  if (!file.type.startsWith('image/')) return toast('Нужен файл изображения: JPG, PNG или WEBP');
  try { const img=await prepImage(await fileToURL(file), kind); S.items[i][kind]=img; renderForm(); persist(); }
  catch(e){ toast('Не удалось открыть изображение'); }
}
function tileFrom(img){ // скруглённая плитка для страницы оборудования
  return readImg(img.src).then(im=>{
    const W=1300,H=860,c=document.createElement('canvas'); c.width=W; c.height=H; const g=c.getContext('2d');
    const rr=(x,y,w,h,r)=>{ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); };
    g.fillStyle='#CFE0F2'; rr(0,0,W,H,28); g.fill(); g.fillStyle='#FFFFFF'; rr(3,3,W-6,H-6,26); g.fill();
    const sc=Math.min((W-180)/im.width,(H-160)/im.height), w=im.width*sc, h=im.height*sc; g.drawImage(im,(W-w)/2,(H-h)/2,w,h);
    return { url:c.toDataURL('image/png'), w:W, h:H };
  });
}

function parseSpecs(txt){
  const groups=[]; let g=null;
  txt.split(/\r?\n/).forEach(l=>{
    if(!l.trim()) return;
    let cells = l.includes('\t') ? l.split('\t') : (l.includes(':') ? [l.slice(0,l.indexOf(':')), l.slice(l.indexOf(':')+1)] : [l]);
    cells=cells.map(s=>s.trim()).filter((s,ix,a)=>ix<2||s);
    if (cells.filter(Boolean).length===1){ g={name:cells.find(Boolean),rows:[]}; groups.push(g); return; }
    if(!g){ g={name:'',rows:[]}; groups.push(g); }
    g.rows.push({k:cells[0],v:cells.slice(1).filter(Boolean).join(' ')});
  });
  return groups.filter(x=>x.rows.length);
}

function aiApply(i){

  s=s.replace(/^```(?:json)?/i,'').replace(/```$/,'').trim();
  const a0=s.indexOf('{'), a1=s.lastIndexOf('}');
  let j; try{ j=JSON.parse(s.slice(a0,a1+1)); }catch(e){ it._aiMsg='Ответ не распознан: вставьте его целиком, начиная с «{».'; renderForm(); return; }
  if (!it.name && j.name) it.name=j.name;

  if (j.pageTitle) it.pageTitle=j.pageTitle;
  if (j.photoCaption && !it.photoCaption) it.photoCaption=j.photoCaption;
  if (Array.isArray(j.features) && j.features.length) it.features=j.features.map(f=>({label:String(f.label||''),text:String(f.text||'')}));
  if (Array.isArray(j.groups) && j.groups.length) it.groups=j.groups.map(g=>({name:String(g.name||''),rows:(g.rows||[]).map(r=>({k:String(r.k||''),v:String(r.v||''),hl:!!r.hl}))}));

  if (j.attrs && typeof j.attrs==='object'){ const keepCat=(it.attrs||{}).cat; it.attrs=Object.fromEntries(Object.entries(j.attrs).filter(([k,v])=>v!==''&&v!=null&&!String(v).includes(' | ')));
    if (!TYPES.some(t=>t.id===it.attrs.cat)) { if (keepCat) it.attrs.cat=keepCat; else delete it.attrs.cat; }
    const t=typeById(it.attrs.cat||keepCat); for (const f of t.fields) if (f.num && it.attrs[f.key]!=null){ const n=numOf(it.attrs[f.key]); if(n!=null) it.attrs[f.key]=n; } }
  it._ans=''; it._aiMsg='Готово. Проверьте заполненные поля.';
  renderForm(); persist(); toast('Данные применены');
}
function applyCover(h, force){

}

function costKP(x){  // себестоимость единицы в валюте КП, копейки (с НДС)
  if (!x.cost) return null;
  const r1=rateOf(x.costCur||'RUB'), r2=rateOf(kpCur()); if (!(r1>0&&r2>0)) return NaN;
  let v=x.cost*r1/r2; if (S.pricing.costNoVat) v*=1+(+S.vat||0)/100; return v;
}
function calcPrice(x){
  const c=costKP(x); if (c==null||Number.isNaN(c)) return c;
  const m=marginOf(x)/100;
  const v = S.pricing.mode==='markup' ? c*(1+m) : (m<0.99 ? c/(1-m) : NaN);
  return Number.isNaN(v)?NaN:roundTo(v);
}
function applyCalc(x){ if (x.priceManual || !x.cost) return; const p=calcPrice(x); if (p>0){ x.price=p; delete x._priceText; } }
function recalcAll(){ S.items.forEach(applyCalc); }
function marginInfo(x){
  const c=costKP(x); if (!c || Number.isNaN(c) || !x.price) return '';
  const prof=x.price-c, mg=prof/x.price*100, mk=prof/c*100;
  return `Себестоимость ${money(Math.round(c))} ${curSh(kpCur())} · прибыль ${money(Math.round(prof))} · маржа ${mg.toFixed(1).replace('.',',')} % · наценка ${mk.toFixed(1).replace('.',',')} %`;
}
let _autoRates=false;
function autoRates(){ const need=[kpCur(),...S.items.filter(x=>x.cost).map(x=>x.costCur||'RUB')].filter(c=>c!=='RUB'&&!(rateOf(c)>0)); if(need.length && !_autoRates){ _autoRates=true; loadCBR().finally(()=>{_autoRates=false;}); } }

async function prepGallery(file){
  const url=await fileToURL(file); const im=await readImg(url);
  const max=2000, sc=Math.min(1,max/Math.max(im.width,im.height)); const w=Math.round(im.width*sc), h=Math.round(im.height*sc);
  const c=document.createElement('canvas'); c.width=w; c.height=h; const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,w,h); g.drawImage(im,0,0,w,h);
  // обрезать белые поля
  const d=g.getImageData(0,0,w,h).data; let x0=w,y0=h,x1=-1,y1=-1;
  for(let y=0;y<h;y+=2) for(let x=0;x<w;x+=2){ const o=(y*w+x)*4; if(d[o]<242||d[o+1]<242||d[o+2]<242){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; } }
  let out=c;
  if (x1>x0&&y1>y0){ const pad=Math.round(Math.max(w,h)*0.01); x0=Math.max(0,x0-pad); y0=Math.max(0,y0-pad); x1=Math.min(w-1,x1+pad+1); y1=Math.min(h-1,y1+pad+1);
    out=document.createElement('canvas'); out.width=x1-x0+1; out.height=y1-y0+1; const og=out.getContext('2d'); og.fillStyle='#fff'; og.fillRect(0,0,out.width,out.height); og.drawImage(c,-x0,-y0); }
  const png = file.type==='image/png' || file.type==='image/gif' || file.type==='image/bmp';
  return { src: out.toDataURL(png?'image/png':'image/jpeg', 0.9), w: out.width, h: out.height };
}
async function addGallery(i, files, slot){

}

function stationsOf(){
  const map=new Map();
  for (const x of S.items){
    const a=attrsOf(x), t=typeById(a.cat); if (t.role==='accessory') continue;
    const model=(x.hint&&x.hint.model) || (a.model&&a.maker?a.maker+' '+a.model:'') || x.name;
    const key=norm(model); const pr=(x.groups||[]).flatMap(g=>g.rows||[]).find(r=>/основная мощность|номинальная мощность/i.test(r.k));
    const power = a.cat==='dgu' ? (pr?pr.v:(a.kva&&a.kw?`${a.kva} кВА / ${a.kw} кВт`:(a.kw?a.kw+' кВт':''))) : mainLine(x,2);
    const st=map.get(key)||{key:'st'+map.size, model, power, exec:a.execution||'', qty:0, photo:x.photo||null, type:a.cat, group:t.group||''};
    st.qty+=(+x.qty||0); if(!st.photo&&x.photo) st.photo=x.photo; map.set(key,st);

/* ---------- импорт позиций из Excel (CSV/TSV) по шаблону типа ---------- */
function xlsColumns(t){
  const cols=[['name','Наименование'],['maker','Производитель'],['series','Серия'],['model','Модель'],['spec','Краткие характеристики']];
  for (const f of t.fields) cols.push([f.key, f.label+(f.unit?', '+f.unit:'')]);
  cols.push(['cost','Закупка за ед.'],['costCur','Валюта закупки (RUB/USD/EUR/CNY)'],['price','Цена продажи за ед., руб.'],['margin','Маржа, %']);
  return cols;
}
function parseTable(txt){
  txt=txt.replace(/^\uFEFF/,''); const first=txt.split(/\r?\n/)[0]||'';
  const sep = first.includes('\t') ? '\t' : (first.split(';').length>=first.split(',').length ? ';' : ',');
  const rows=[]; let row=[], cell='', q=false;
  for (let k=0;k<txt.length;k++){ const c=txt[k];
    if (q){ if (c==='"'){ if (txt[k+1]==='"'){ cell+='"'; k++; } else q=false; } else cell+=c; continue; }
    if (c==='"'){ q=true; continue; }
    if (c===sep){ row.push(cell); cell=''; continue; }
    if (c==='\n' || c==='\r'){ if (c==='\r'&&txt[k+1]==='\n') k++; row.push(cell); rows.push(row); row=[]; cell=''; continue; }
    cell+=c; }
  if (cell!==''||row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r=>r.some(c=>String(c).trim()!==''));
}

      if (!CUR_LIST.includes(x.costCur)) x.costCur='RUB';
      x.groups=groupsFromAttrs(x); x.hint=autoHint(x); if(!x.spec) x.spec=mainLine(x,4);
      const ex=catCache.find(z=>z.id===x.id); if (ex){ x.photo=ex.photo; x.logo=ex.logo; x.prices=ex.prices||[]; if(!x.price) x.price=ex.price||0; if (ex.features&&ex.features.length) x.features=ex.features; }
      await store().put(x); n++;
    }
    await refreshCat(); d.close(); toast(`Импортировано позиций: ${n}${skipped.length?`, пропущено строк без наименования: ${skipped.length}`:''}`);

  const userTypes=()=>{ const base=new Map(((TYPES_BUILTIN&&TYPES_BUILTIN.types)||[]).map(t=>[t.id,JSON.stringify(t)])); return TYPES.filter(t=>base.get(t.id)!==JSON.stringify(t)); };
  d.innerHTML=`<div class="dlg-h"><h3>Типы оборудования</h3><button class="icon" type="button" data-close aria-label="Закрыть">✕</button></div>
   <div class="dlg-b"><p class="muted" style="margin-top:0">Тип задаёт, какие параметры есть у оборудования, по каким из них работают фильтры каталога, что выводится на титуле и какие опции предлагаются. Добавить новый тип можно без программирования: нажмите «+ Новый тип» и поправьте поля по образцу.</p>
   <div class="tlist">${TYPES.map(t=>`<div class="trow"><b>${esc(t.name)}</b><span class="muted">${esc(t.group||'')} · ${t.fields.length} параметров · основной: ${esc((t.fields.find(f=>f.key===t.main)||{}).label||t.main||'—')}</span>
     <button class="btn ghost" type="button" data-tedit="${esc(t.id)}">Изменить</button></div>`).join('')}</div>
   <div class="row" style="margin-top:12px"><button class="btn" type="button" id="tNew">+ Новый тип</button><span style="flex:1"></span><button class="btn ghost" type="button" id="tReset">Вернуть стандартные типы</button></div>
   <div id="tEd"></div></div>`;
  d.showModal(); d.querySelector('[data-close]').onclick=()=>{ d.close(); d.classList.remove('wide'); };
  const save=async(list)=>{
    const payload={version:1,types:list};
    if (SRV.on){ await api('/api/types',{method:'PUT',headers:{'Content-Type':'application/json; charset=utf-8'},body:JSON.stringify(payload)}); }
    else localStorage.setItem('kp.types',JSON.stringify(payload));
    await loadTypes(); catCache.forEach(x=>delete x._a); renderForm(); openTypesEditor(); toast('Справочник типов сохранён'); };
  const edit=(t)=>{
    $('#tEd').innerHTML=`<p class="sub" style="margin-top:16px">${esc(t.name||'Новый тип')}</p>
      <p class="muted">Формат JSON. <b>fields</b> — параметры: key (латиницей), label, unit, num (число), range (фильтр «от–до»), facet (фильтр-список), values (варианты), kpi (на титул), group (группа в таблице характеристик). <b>options</b> — быстрые опции: [«полное название», «кнопка», «шт. или усл.»].</p>
      <textarea id="tJson" rows="18" spellcheck="false" style="font-family:ui-monospace,Consolas,monospace;font-size:13px">${esc(JSON.stringify(t,null,2))}</textarea>
      <div class="row" style="margin-top:8px"><button class="btn primary" type="button" id="tSave">Сохранить тип</button>${t.id&&!((TYPES_BUILTIN&&TYPES_BUILTIN.types)||[]).some(b=>b.id===t.id)?'<button class="btn ghost" type="button" id="tDel">Удалить тип</button>':''}<span class="muted" id="tErr"></span></div>`;
    $('#tSave').onclick=async()=>{ let j; try{ j=JSON.parse($('#tJson').value); }catch(e){ $('#tErr').textContent='Ошибка в JSON: '+e.message; return; }
      if (!/^[a-z][a-z0-9_]{1,30}$/.test(j.id||'')) { $('#tErr').textContent='id — латиница, цифры и «_», начинается с буквы'; return; }
      if (!j.name || !Array.isArray(j.fields)) { $('#tErr').textContent='Нужны поля name и fields'; return; }
      if (j.fields.some(f=>!f.key||!f.label)) { $('#tErr').textContent='У каждого параметра нужны key и label'; return; }
      const list=userTypes().filter(x=>x.id!==j.id); list.push(j); await save(list); };
    const del=$('#tDel'); if (del) del.onclick=async()=>{ if(!confirm('Удалить тип? Позиции этого типа останутся в каталоге как «Прочее».')) return; await save(userTypes().filter(x=>x.id!==t.id)); };
    $('#tJson').focus(); };
  d.querySelector('.tlist').onclick=e=>{ const b=e.target.closest('[data-tedit]'); if(b) edit(typeById(b.dataset.tedit)); };
  $('#tNew').onclick=()=>edit({id:'new_type',group:'Компрессоры',name:'Новый тип',item:'Оборудование',coverTitle:'Оборудование',role:'equipment',main:'kw',match:'',
     fields:[{key:'kw',label:'Мощность',unit:'кВт',num:true,range:true,kpi:true,group:'Основные'}],options:[['Доставка до объекта','доставка','усл.']]});
  $('#tReset').onclick=async()=>{ if(!confirm('Удалить все свои изменения типов и вернуть стандартные?')) return; await save([]); };
}
/* ---------- журнал КП ---------- */
async function openJournal(){
  const d=$('#dlg');
  d.innerHTML=`<div class="dlg-h"><h3>Журнал КП</h3><button class="icon" type="button" data-close aria-label="Закрыть">✕</button></div>
   <div class="dlg-b"><input type="text" id="jQ" placeholder="Поиск по номеру, получателю или позиции" autocomplete="off" style="margin-bottom:8px"><div id="jList"><p class="empty">Загружаю…</p></div></div>`;
  d.showModal(); d.querySelector('[data-close]').onclick=()=>d.close();
  let rows=[]; try{ rows=await api('/api/history'); }catch(e){ $('#jList').innerHTML='<p class="empty">Журнал недоступен.</p>'; return; }
  rows.sort((a,b)=>String(b.number).localeCompare(String(a.number)));
  const draw=()=>{ const q=norm($('#jQ').value); const list=rows.filter(r=>!q||norm([r.number,r.client,(r.items||[]).join(' ')].join(' ')).includes(q));
    $('#jList').innerHTML = list.length ? list.map(r=>`<div class="jr"><div><span class="n">№ ${esc(r.number)}</span><div class="muted">${esc(KPGen.ruDate(r.date))}</div></div>
      <div><b>${esc(r.client)}</b><span class="muted">${money(r.sum||0)} руб. · ${r.positions||0} ${plural(r.positions||0,'позиция','позиции','позиций')}${(r.items&&r.items[0])?' · '+esc(r.items[0]):''}</span></div>
      <div class="acts"><button class="btn" type="button" data-jo="${esc(r.id)}">Открыть</button><button class="btn" type="button" data-jc="${esc(r.id)}">Копия</button><button class="btn" type="button" data-a="openDoc" data-id="${esc(r.id)}">Word</button></div></div>`).join('')
      : `<p class="empty">${rows.length?'Ничего не найдено.':'Журнал пуст. Сохранённые КП появятся здесь.'}</p>`; };
  draw(); $('#jQ').oninput=draw;
  $('#jList').onclick=async e=>{
    const o=e.target.closest('[data-jo]'), c=e.target.closest('[data-jc]'); if(!o&&!c) return;
    try{
      const st=await api(`/api/kp/${(o||c).dataset[o?'jo':'jc']}/state`);
      S=Object.assign(freshState(), st);
      if (c){ delete S.kpId; delete S.number; S.date=today(); S.client=''; }
      d.close(); renderForm(); persist(); window.scrollTo({top:0});
      toast(c?'Создана копия — укажите получателя':'КП № '+S.number+' открыто для редактирования');
    }catch(err){ toast('Не удалось открыть КП'); }
  };
}

/* ---------- сборка DOCX ---------- */
async function download(){
  const msg=$('#dlmsg'); const btn=document.querySelector('[data-a="download"]');
  if (problems().length) return;
  if (!window.JSZip){ msg.className='msg err'; msg.textContent='Не загрузился модуль сборки файла. Обновите страницу.'; return; }
  btn.disabled=true; btn.textContent='Собираю файл…'; msg.textContent='';
  try{
    const St = JSON.parse(JSON.stringify(S, (k,v)=>k.startsWith('_')?undefined:v));
    St.vat=+S.vat; St.cur={code:kpCur(), rate:kpCur()!=='RUB'?rateOf(kpCur()):null, date:S.pricing.rateDate||''}; St.items=S.items.map(x=>({...x, qty:+x.qty, photo:undefined, logo:undefined, _srcImg:undefined, options:(x.options||[]).filter(o=>o.name.trim()&&+o.qty>0).map(o=>({name:o.name.trim(), short:o.short, unit:o.unit, qty:+o.qty, price:o.price||0}))}));
    if (SRV.on && !S.kpId){ const r=await api('/api/kp/new',{method:'POST'}); S.kpId=r.id; S.number=r.number; St.kpId=r.id; St.number=r.number; }
    const zip = await JSZip.loadAsync(BASE64, {base64:true});
    const Min={cover:null,items:{}};
    const STS=stationsOf();
    if (STS.length>=2){
      St.stations=STS.map(s=>({key:s.key,model:s.model,power:s.power,exec:s.exec,qty:s.qty}));
      Min.thumbs={};
      for (const s of STS){ if(!s.photo) continue; zip.file(`word/media/${s.key}.jpg`, b64(await toDataURL(s.photo)), {base64:true}); Min.thumbs[s.key]={file:`${s.key}.jpg`,w:s.photo.w,h:s.photo.h}; }
      if (!S.cover.touched){
        const makers=new Set(STS.map(s=>s.model.split(' ')[0]));
        const kvas=STS.filter(s=>/кВА/.test(s.power||'')).map(s=>parseFloat(String(s.power).replace(',','.'))).filter(x=>x>0);
        if (STS.length>3) St.cover.model = `${STS.length} ${plural(STS.length,'модель','модели','моделей')}` + (kvas.length && STS.every(s=>s.type==='dgu')?` · ${Math.min(...kvas)}–${Math.max(...kvas)} кВА`.replace(/\./g,','):'');
        else St.cover.model = makers.size===1 && STS.every(s=>s.model.startsWith('Tide Power ')) ? 'Tide Power '+STS.map(s=>s.model.replace('Tide Power ','')).join(' · ') : STS.map(s=>s.model).join(' · ');
        const cats=new Set(STS.map(s=>s.type)), grps=new Set(STS.map(s=>s.group));
        St.cover.title = cats.size===1 ? (typeById([...cats][0]).coverTitle||typeById([...cats][0]).name) : grps.size===1 ? [...grps][0] : 'Оборудование';
        St.cover.desc = `В предложение входят ${STS.length} ${plural(STS.length,'модель','модели','моделей')} оборудования. Характеристики каждой модели приведены на отдельной странице.`;
      }
    }
    const coverItem=S.items.find(x=>x.photo);
    if (coverItem){ zip.file('word/media/cover.jpg', b64(await toDataURL(coverItem.photo)), {base64:true}); Min.cover={file:'cover.jpg',w:coverItem.photo.w,h:coverItem.photo.h}; }
    for (const x of S.items){ if(!x.page) continue; const m={};
      if (x.photo){ const t=await tileFrom(x.photo); zip.file(`word/media/tile_${x.id}.png`, b64(t.url), {base64:true}); m.tile={file:`tile_${x.id}.png`,w:t.w,h:t.h}; }
      if (x.logo){ zip.file(`word/media/logo_${x.id}.png`, b64(await toDataURL(x.logo)), {base64:true}); m.logo={file:`logo_${x.id}.png`,w:x.logo.w,h:x.logo.h}; }
      m.gallery=[]; let gk=0;
      for (const g of (x.gallery||[])){ if (g.on===false) continue; const du=await toDataURL(g); if(!du) continue;
        const ext=/^data:image\/png/.test(du)?'png':'jpg'; const fnm=`gal_${x.id}_${++gk}.${ext}`;
        zip.file(`word/media/${fnm}`, b64(du), {base64:true}); m.gallery.push({file:fnm, w:g.w, h:g.h, caption:(g.caption||'').trim(), wide:galWide(g)}); }
      Min.items[x.id]=m; }
    const out = KPGen.build(St, Min, ROOTS);
    zip.file('word/document.xml', out.document); zip.file('word/footer1.xml', out.footer); zip.file('word/_rels/document.xml.rels', out.rels);
    const blob = await zip.generateAsync({type:'blob', mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document', compression:'DEFLATE'});
    if (SRV.on){
      btn.textContent='Сохраняю в журнал…';
      await syncCatalog(S.number);
      for (const it of S.items){ it.photo=await uploadImg(it.photo); it.logo=await uploadImg(it.logo); if (it.gallery) for (const g of it.gallery){ const u=await uploadImg(g); if(u) g.src=u.src; } }
      const t=totals(S.items.map(x=>({qty:+x.qty||0,price:x.price||0})), +S.vat||0), fn=fileName();
      await api(`/api/kp/${S.kpId}/docx?name=${encodeURIComponent(fn)}`,{method:'PUT',body:blob});
      const clean=JSON.parse(JSON.stringify(S,(k,v)=>k.startsWith('_')?undefined:v));
      await api(`/api/kp/${S.kpId}/state`,{method:'PUT',headers:{'Content-Type':'application/json; charset=utf-8'},body:JSON.stringify(clean)});
      const meta={ id:S.kpId, number:S.number, date:S.date, client:S.client, sum:t.sum, units:t.units, positions:S.items.length,
        items:S.items.map(x=>x.name).slice(0,3), file:fn, manager:S.manager.name, savedAt:new Date().toISOString() };
      await api(`/api/kp/${S.kpId}/meta`,{method:'PUT',headers:{'Content-Type':'application/json; charset=utf-8'},body:JSON.stringify(meta)});
      persist(); renderForm();
      const m2=$('#dlmsg'); m2.className='msg ok';
      m2.innerHTML=`КП № ${esc(S.number)} сохранено, каталог обновлён.<div class="row" style="justify-content:center;margin-top:8px"><button class="btn" type="button" data-a="openDoc" data-id="${esc(S.kpId)}">Открыть в Word</button><button class="btn" type="button" data-a="showDoc" data-id="${esc(S.kpId)}">Показать в папке</button></div>`;
      return;
    }
    await syncCatalog('');
    const done=await saveFile(fileName(), blob); msg.className='msg '+(done?'ok':'err'); msg.textContent= done ? 'Файл сохранён. Позиции добавлены в каталог.' : 'Сохранение отменено.';
  } catch(e){
    msg.className='msg err';
    msg.textContent = e&&e.code==='declined' ? 'Сохранение отменено.' : e&&e.code==='rate_limited' ? 'Окно сохранения уже открыто.' : 'Не удалось собрать файл: '+(e&&e.message||e);
  }
  btn.disabled=false; btn.textContent=SRV.on?'Сохранить КП':'Скачать КП (.docx)';
}
(async()=>{
  if (location.protocol.startsWith('http')){ try{ SRV.info=await api('/api/ping'); SRV.on=true; }catch(e){} }
  if (SRV.on){ $('#srvBtns').hidden=false; $('#btnExit').hidden=false; document.title='Конструктор КП — ПНЕВМОТЕХ'; }
  await loadTypes(); await refreshCat(); renderForm();
  if (!S.items.length && catCache.length) openCatalog({});
})();
renderForm();
</script>
