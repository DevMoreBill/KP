name: Сборка EXE для Windows

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: 'Выпустить релиз v<версия из app/version.py> с EXE, комплектом и патчем'
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

jobs:
  # сборка того же коммита, что уже проверен при отправке, проверки не повторяет (они идут ~6 мин): ищется успешный запуск
  # этого рабочего процесса по событию push с тем же коммитом
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      tested: ${{ steps.find.outputs.tested }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tested=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            n=$(gh api "repos/${{ github.repository }}/actions/workflows/build-exe.yml/runs?event=push&status=success&head_sha=${{ github.sha }}&per_page=1" --jq '.total_count' || echo 0)
            [ "${n:-0}" -gt 0 ] && tested=true
          fi
          echo "tested=$tested" >> "$GITHUB_OUTPUT"
          echo "Коммит ${{ github.sha }} уже проверен при отправке: $tested"

  # статические проверки: репозиторий, pyflakes, ESLint (с необъявленными именами), оформление (Ruff, mypy, Prettier)
  static:
    needs: gate
    if: needs.gate.outputs.tested != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Проверка репозитория — нет баз, выгрузок и ключей API
        run: python .github/scripts/repo_guard.py .

      - name: pyflakes — сервер, проверки, служебные сценарии
        run: |
          python -m pip install --upgrade pip pyflakes==4.0.0
          python -m pyflakes app/*.py tests/*.py .github/scripts/*.py

      - name: ESLint — интерфейс (eslint.config.mjs, необъявленные имена)
        run: npx --yes eslint@10.1.0 --max-warnings 0 app/web/js

      - name: Оформление переписанного кода — Ruff, mypy, Prettier (tests/code_style.py)
        run: |
          python -m pip install ruff==0.15.8 mypy==2.4.0
          python tests/code_style.py

  # наборы tests/ на стенде со сгенерированной базой (без данных пользователя) — тремя параллельными частями по времени
  # (tests/suite_times.json, run_all.py --shard); EXE собирается, только если всё прошло
  tests:
    needs: gate
    if: needs.gate.outputs.tested != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Проверки программы, часть ${{ matrix.shard }} из 3 (tests/run_all.py)
        run: |
          python -m pip install pyflakes==4.0.0
          python tests/run_all.py --no-static --strict --shard=${{ matrix.shard }}/3

  # EXE собирается только по команде владельца (17.10): запуск вручную (workflow_dispatch) или метка v*; при отправке — только проверки
  build:
    needs: [gate, static, tests]
    # проверки прошли сейчас или этот коммит уже проверен при отправке (тогда static и tests пропущены)
    if: >-
      always() && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')) &&
      needs.gate.result == 'success' &&
      ((needs.static.result == 'success' && needs.tests.result == 'success') ||
       (needs.gate.outputs.tested == 'true' && needs.static.result == 'skipped' && needs.tests.result == 'skipped'))
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows 8.1 / 10 / 11, 64-бит — сервер отдела; сотрудники работают через браузер (сборки для Windows 7 нет)
          - python: '3.12'
            arch: x64
            exe: 'Конструктор КП'
    env:
      KP_EXE_NAME: ${{ matrix.exe }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.arch }}

      # базы программы, выгрузки и ключи API в репозиторий не попадают: нашлись — сборка останавливается со списком файлов
      - name: Проверка репозитория — нет баз, выгрузок и ключей API
        run: python .github/scripts/repo_guard.py .

      - name: Установка PyInstaller
        run: python -m pip install --upgrade pip -r requirements-build.txt

      - name: Сборка
        run: python -m PyInstaller --noconfirm --clean kp.spec

      - name: Проверка сборки — модуль SQLite внутри EXE
        shell: pwsh
        run: |
          $toc = Get-ChildItem -Recurse -Path build -Filter 'xref-*.html' | Select-Object -First 1
          if ($toc -and -not (Select-String -Path $toc.FullName -Pattern 'sqlite3' -Quiet)) { throw 'В сборку не попал модуль sqlite3' }

      - name: LibreOffice для проверки сохранения КП в PDF
        if: matrix.arch == 'x64'
        shell: pwsh
        timeout-minutes: 30
        # download.documentfoundation.org с серверов GitHub бывает недоступен (через него качает и Chocolatey):
        # сначала установщик напрямую с зеркал LibreOffice, затем — Chocolatey
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $mirrors = @('https://ftp.fau.de/tdf/libreoffice/stable/', 'https://mirror.netcologne.de/tdf/libreoffice/stable/',
                       'https://mirrors.dotsrc.org/tdf/libreoffice/stable/', 'https://ftp.gwdg.de/pub/tdf/libreoffice/stable/')
          $msi = Join-Path $env:RUNNER_TEMP 'lo.msi'; $ok = $false
          foreach ($m in $mirrors) {
            try {
              $list = (Invoke-WebRequest -Uri $m -UseBasicParsing -TimeoutSec 30).Content
              $ver = [regex]::Matches($list, 'href="(\d+\.\d+\.\d+)/"') | ForEach-Object { $_.Groups[1].Value } | Sort-Object { [version]$_ } | Select-Object -Last 1
              if (-not $ver) { throw 'нет списка версий' }
              $url = "$m$ver/win/x86_64/LibreOffice_${ver}_Win_x86-64.msi"
              Write-Host "Скачиваю $url"
              Invoke-WebRequest -Uri $url -OutFile $msi -UseBasicParsing -TimeoutSec 600
              if ((Get-Item $msi).Length -lt 100MB) { throw 'файл установщика неполный' }
              $p = Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn /norestart" -Wait -PassThru
              if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) { throw "msiexec: код $($p.ExitCode)" }
              $ok = $true; Write-Host "LibreOffice $ver установлен с зеркала $m"; break
            } catch { Write-Host "Зеркало $m не подошло: $($_.Exception.Message)" }
          }
          if (-not $ok) {
            foreach ($pkg in @('libreoffice-still', 'libreoffice-fresh')) {
              choco install $pkg -y --no-progress --limit-output
              if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            }
          }
          if (-not $ok) { throw 'LibreOffice не установился: зеркала и сайт загрузки недоступны' }
          $global:LASTEXITCODE = 0

      - name: Проверка запуска EXE
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "dist\$env:KP_EXE_NAME.exe"
          $dir = Join-Path $env:RUNNER_TEMP 'kp-smoke'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item -LiteralPath $exe -Destination (Join-Path $dir 'kp.exe')
          $p = Start-Process -FilePath (Join-Path $dir 'kp.exe') -WorkingDirectory $dir -PassThru
          $ok = $false
          for ($i = 0; $i -lt 60 -and -not $ok; $i++) {
            Start-Sleep -Seconds 1
            try { $r = Invoke-RestMethod -Uri 'http://127.0.0.1:17845/api/ping' -TimeoutSec 2; $ok = $r.ok } catch {}
          }
          if (-not $ok) { throw 'Сервер не ответил на /api/ping' }
          # каталог и фото в EXE не входят (они в базе на сервере отдела): новая база пустая — создаём пробную позицию с фото
          # пустой ответ «[]» PowerShell превращает в $null (@($null).Count = 1) — сравниваем сам текст ответа
          $raw = (Invoke-WebRequest -Uri 'http://127.0.0.1:17845/api/catalog' -UseBasicParsing).Content.Trim()
          if ($raw -ne '[]') { throw "Новая база не пустая: $($raw.Substring(0, [Math]::Min(120, $raw.Length)))" }
          if (-not (Test-Path -LiteralPath (Join-Path $dir 'data\kp.sqlite3'))) { throw 'База SQLite не создана' }
          $png = Join-Path $env:RUNNER_TEMP 'ci-photo.png'
          [IO.File]::WriteAllBytes($png, [Convert]::FromBase64String('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg=='))
          $im = Invoke-RestMethod -Method Post -Uri 'http://127.0.0.1:17845/api/img?cat=dgu&maker=CI&model=Test%201&name=CI%20Test%201' -InFile $png -ContentType 'image/png'
          $item = @{ id = 'ci_item'; name = 'CI Test 1'; attrs = @{ cat = 'dgu'; maker = 'CI'; model = 'Test 1'; kw = 100; kwMax = 110 }; photo = @{ src = '/img/' + $im.name } } | ConvertTo-Json -Compress -Depth 4
          Invoke-RestMethod -Method Put -Uri 'http://127.0.0.1:17845/api/catalog/ci_item' -ContentType 'application/json; charset=utf-8' -Body ([Text.Encoding]::UTF8.GetBytes($item)) | Out-Null
          $cat = @(Invoke-RestMethod -Uri 'http://127.0.0.1:17845/api/catalog')
          Write-Host "Позиций в каталоге: $($cat.Count)"
          if ($cat.Count -lt 1) { throw 'Позиция каталога не сохранилась' }
          $one = Invoke-RestMethod -Uri ("http://127.0.0.1:17845/api/catalog/" + $cat[0].id)
          if (-not $one.name) { throw 'Позиция каталога не читается из базы' }
          # изображения разложены по папкам категорий и отдаются по адресу /img/<раздел>/<категория>/…
          $withPhoto = $cat | Where-Object { $_.photo -and $_.photo.src } | Select-Object -First 1
          if ($withPhoto.photo.src -cnotmatch '^/img/[a-z0-9-]+/[a-z0-9-]+/[a-z0-9-]+/[a-z0-9_.-]+$') { throw "Фото не в папке категории латиницей: $($withPhoto.photo.src)" }
          $ph = Invoke-WebRequest -Uri ("http://127.0.0.1:17845" + $withPhoto.photo.src) -UseBasicParsing
          if ($ph.StatusCode -ne 200) { throw 'Фото из папки категории не отдаётся' }
          $tpl = Invoke-RestMethod -Uri 'http://127.0.0.1:17845/api/templates'
          if ($tpl.Count -lt 1) { throw 'Шаблоны КП не найдены' }
          if (-not ($tpl | Where-Object { $_.id -eq 'tender' })) { throw 'Нет тендерного шаблона' }
          $types = Invoke-RestMethod -Uri 'http://127.0.0.1:17845/api/types'
          Write-Host "Типов оборудования: $($types.types.Count)"
          if ($types.types.Count -lt 5) { throw 'Справочник типов не загрузился' }
          foreach ($id in @('comp_diesel', 'comp_scroll', 'dryer_refrig', 'dryer_ads', 'filter', 'receiver', 'spare')) {
            if (-not ($types.types | Where-Object { $_.id -eq $id })) { throw "Нет категории $id" }
          }
          $sk = Invoke-WebRequest -Uri 'http://127.0.0.1:17845/tpl/pnevmotekh/skeleton.js' -UseBasicParsing
          if ($sk.Content -notmatch 'function kpSkeleton') { throw 'Скелет шаблона (skeleton.js) не отдаётся' }
          $ed = Invoke-RestMethod -Uri 'http://127.0.0.1:17845/tpl/pnevmotekh/editor.json'
          if ($ed.tabs.Count -lt 5) { throw 'Форма редактора шаблона (editor.json) не загрузилась' }
          foreach ($f in @('skeleton.js', 'editor.json', 'template.json', 'base.docx')) {
            if (-not (Test-Path -LiteralPath (Join-Path $dir "templates\pnevmotekh\$f"))) { throw "Файл шаблона $f не разложен рядом с программой" }
          }
          # «Настройки»: при первом запуске пароля нет; DELETE и запись шаблона без входа администратора — 403
          $st = Invoke-RestMethod -Uri 'http://127.0.0.1:17845/api/admin/status'
          if ($st.hasPassword -or -not $st.canSetup -or $st.idleMinutes -ne 15) { throw 'Состояние «Настроек» при первом запуске неверно' }
          $code = 0; try { Invoke-WebRequest -Method Delete -Uri 'http://127.0.0.1:17845/api/managers/ci_manager' -UseBasicParsing | Out-Null } catch { $code = [int]$_.Exception.Response.StatusCode }
          if ($code -ne 403) { throw "DELETE без входа администратора: ожидался код 403, получен $code" }
          $code = 0; try { Invoke-WebRequest -Method Put -Uri 'http://127.0.0.1:17845/api/templates/pnevmotekh/file?name=template.json' -ContentType 'application/json' -Body '{}' -UseBasicParsing | Out-Null } catch { $code = [int]$_.Exception.Response.StatusCode }
          if ($code -ne 403) { throw "Запись шаблона без входа администратора: ожидался код 403, получен $code" }
          # защита от чужих сайтов: подделка запроса (Origin) и подмена DNS (Host) — 403
          $code = 0; try { Invoke-WebRequest -Method Post -Uri 'http://127.0.0.1:17845/api/shutdown' -Headers @{ 'Origin' = 'http://evil.example' } -UseBasicParsing | Out-Null } catch { $code = [int]$_.Exception.Response.StatusCode }
          if ($code -ne 403) { throw "Запрос с чужого сайта: ожидался код 403, получен $code" }
          $code = 0; try { Invoke-WebRequest -Uri 'http://127.0.0.1:17845/api/admin/status' -Headers @{ 'Host' = 'evil.example' } -UseBasicParsing | Out-Null } catch { $code = [int]$_.Exception.Response.StatusCode }
          if ($code -ne 403) { throw "Запрос с чужим именем сервера: ожидался код 403, получен $code" }
          $login = Invoke-RestMethod -Method Post -Uri 'http://127.0.0.1:17845/api/admin/setup' -ContentType 'application/json' -Body '{"password":"CiPassw0rd1"}' -SessionVariable adm
          if (-not $login.csrf) { throw 'Первый пароль администратора не задаётся' }
          $ah = @{ 'X-CSRF-Token' = $login.csrf }
          $code = 0; try { Invoke-WebRequest -Method Post -Uri 'http://127.0.0.1:17845/api/admin/delete' -ContentType 'application/json' -Body '{"type":"kp","ids":[]}' -WebSession $adm -UseBasicParsing | Out-Null } catch { $code = [int]$_.Exception.Response.StatusCode }
          if ($code -ne 401) { throw "Запрос администратора без CSRF-токена: ожидался код 401, получен $code" }
          $stats = Invoke-RestMethod -Uri 'http://127.0.0.1:17845/api/admin/stats' -WebSession $adm -Headers $ah
          if ($null -eq $stats.kp) { throw 'Статистика «Настроек» не отдаётся' }
          Write-Host 'Настройки: пароль, вход, CSRF, запрет удаления без входа — в порядке'
          # администраторы: второй с логином, вход по логину и паролю, неверный пароль — 403
          $u = Invoke-RestMethod -Method Post -Uri 'http://127.0.0.1:17845/api/admin/users' -ContentType 'application/json' -Body '{"action":"add","login":"ci_second","name":"CI","password":"CiPassw0rd2"}' -WebSession $adm -Headers $ah
          $users = @((Invoke-RestMethod -Uri 'http://127.0.0.1:17845/api/admin/users' -WebSession $adm -Headers $ah).items)
          if ($users.Count -ne 2 -or -not ($users | Where-Object { $_.login -eq 'admin' })) { throw 'Учётные записи администраторов не сохраняются' }
          $l2 = Invoke-RestMethod -Method Post -Uri 'http://127.0.0.1:17845/api/admin/login' -ContentType 'application/json' -Body '{"login":"ci_second","password":"CiPassw0rd2"}'
          if (-not $l2.csrf) { throw 'Вход по логину и паролю не работает' }
          $code = 0; try { Invoke-WebRequest -Method Post -Uri 'http://127.0.0.1:17845/api/admin/login' -ContentType 'application/json' -Body '{"login":"ci_second","password":"wrong1234"}' -UseBasicParsing | Out-Null } catch { $code = [int]$_.Exception.Response.StatusCode }
          if ($code -ne 403) { throw "Неверный пароль: ожидался код 403, получен $code" }
          # производственный календарь: строка на каждый день года (из сети или приблизительный)
          $cal = Invoke-RestMethod -Uri 'http://127.0.0.1:17845/api/calendar?year=2026'
          if ($cal.days.Length -ne 365) { throw 'Производственный календарь не отдаётся' }
          Write-Host ('Календарь: ' + $cal.src)
          # история версий КП: пересохранение оставляет прежний вариант
          $J = 'application/json; charset=utf-8'
          Invoke-RestMethod -Method Put -Uri 'http://127.0.0.1:17845/api/kp/ci_ver/state' -ContentType $J -Body '{"client":"v1","items":[]}' | Out-Null
          Invoke-RestMethod -Method Put -Uri 'http://127.0.0.1:17845/api/kp/ci_ver/state' -ContentType $J -Body '{"client":"v2","items":[]}' | Out-Null
          $vers = @(Invoke-RestMethod -Uri 'http://127.0.0.1:17845/api/kp/ci_ver/versions')
          if ($vers.Count -ne 1) { throw 'История версий КП не сохраняется' }
          $v1 = Invoke-RestMethod -Uri ('http://127.0.0.1:17845/api/kp/ci_ver/versions/' + $vers[0].id)
          if ($v1.client -ne 'v1') { throw 'Версия КП открывается неверно' }
          Write-Host 'Администраторы, календарь, версии КП — в порядке'
          # «Экономика сделки»: расчёт чужого КП сервер не отдаёт и не даёт затереть
          $kn = Invoke-RestMethod -Method Post -Uri 'http://127.0.0.1:17845/api/kp/new'
          $st = '{"kpId":"' + $kn.id + '","authorId":"ci_a","managerId":"ci_a","items":[],"deal":{"v":1,"touched":true,"mnt":"100"}}'
          Invoke-RestMethod -Method Put -Uri "http://127.0.0.1:17845/api/kp/$($kn.id)/state" -ContentType 'application/json' -Body $st -Headers @{ 'X-KP-User-Id' = 'ci_a' } | Out-Null
          $mine = Invoke-RestMethod -Uri "http://127.0.0.1:17845/api/kp/$($kn.id)/state" -Headers @{ 'X-KP-User-Id' = 'ci_a' }
          $other = Invoke-RestMethod -Uri "http://127.0.0.1:17845/api/kp/$($kn.id)/state" -Headers @{ 'X-KP-User-Id' = 'ci_b' }
          if (-not $mine.deal -or $other.deal -or -not $other.locked) { throw 'Экономика сделки видна не только автору КП' }
          Invoke-RestMethod -Method Put -Uri "http://127.0.0.1:17845/api/kp/$($kn.id)/state" -ContentType 'application/json' -Body ('{"kpId":"' + $kn.id + '","items":[]}') -Headers @{ 'X-KP-User-Id' = 'ci_b' } | Out-Null
          $kept = Invoke-RestMethod -Uri "http://127.0.0.1:17845/api/kp/$($kn.id)/state" -Headers @{ 'X-KP-User-Id' = 'ci_a' }
          if (-not $kept.deal -or $kept.authorId -ne 'ci_a') { throw 'Сохранение КП не автором затёрло экономику сделки' }
          Write-Host 'Экономика сделки: доступ только автору — в порядке'
          # общие подсказки «Экономики сделки» и ключевая ставка ЦБ (сайт ЦБ может быть недоступен — нужен ответ, не ошибка сервера)
          # справочник поставщиков меняет администратор (или менеджер с правом «Без модерации», 3.103): без входа — 403
          $supBody = [Text.Encoding]::UTF8.GetBytes('{"name":"CI Поставщик","country":"Китай","adv":"30"}')
          $code = 0; try { Invoke-WebRequest -Method Put -Uri 'http://127.0.0.1:17845/api/suppliers/ci_sup' -ContentType 'application/json; charset=utf-8' -Body $supBody -UseBasicParsing | Out-Null } catch { $code = [int]$_.Exception.Response.StatusCode }
          if ($code -ne 403) { throw "Поставщик без прав: ожидался код 403, получен $code" }
          $ls = Invoke-WebRequest -Method Post -Uri 'http://127.0.0.1:17845/api/admin/login' -ContentType 'application/json' -Body '{"login":"ci_second","password":"CiPassw0rd2"}' -SessionVariable sup -UseBasicParsing
          $supH = @{ 'X-CSRF-Token' = ($ls.Content | ConvertFrom-Json).csrf }
          Invoke-RestMethod -Method Put -Uri 'http://127.0.0.1:17845/api/suppliers/ci_sup' -ContentType 'application/json; charset=utf-8' -Body $supBody -Headers $supH -WebSession $sup | Out-Null
          $sl = @(Invoke-RestMethod -Uri 'http://127.0.0.1:17845/api/suppliers' | ForEach-Object { $_ })
          if (-not ($sl | Where-Object { $_.id -eq 'ci_sup' -and $_.country -eq 'Китай' -and $_.adv -eq '30' })) { throw 'Справочник поставщиков не сохраняется' }
          Invoke-RestMethod -Method Put -Uri 'http://127.0.0.1:17845/api/customs' -ContentType 'application/json; charset=utf-8' -Body '{"key":"cat:comp_screw","code":"8414 80","duty":"0"}' | Out-Null
          $cs = Invoke-RestMethod -Uri 'http://127.0.0.1:17845/api/customs'
          if ($cs.'cat:comp_screw'.code -ne '8414 80') { throw 'Коды ТН ВЭД не сохраняются' }
          $kr = Invoke-RestMethod -Uri 'http://127.0.0.1:17845/api/cbr/keyrate' -Headers @{ 'X-KP-User-Id' = 'ci_a' } -TimeoutSec 60
          Write-Host "Ключевая ставка ЦБ: $($kr.rate) $($kr.date) $($kr.error)"
          $tj = Invoke-WebRequest -Uri 'http://127.0.0.1:17845/tpl/pnevmotekh/template.json' -UseBasicParsing
          Invoke-RestMethod -Method Put -Uri 'http://127.0.0.1:17845/api/templates/pnevmotekh/file?name=template.json' -ContentType 'application/json; charset=utf-8' -Body ([Text.Encoding]::UTF8.GetBytes($tj.Content)) -WebSession $adm -Headers $ah | Out-Null
          $hist = @(Invoke-RestMethod -Uri 'http://127.0.0.1:17845/api/templates/pnevmotekh/history')
          if ($hist.Count -lt 1) { throw 'История версий шаблона не пишется' }
          Invoke-RestMethod -Method Post -Uri 'http://127.0.0.1:17845/api/templates/pnevmotekh/reset' -WebSession $adm -Headers $ah | Out-Null
          Write-Host "Шаблон: скелет, форма редактора, сохранение с историей ($($hist.Count)), заводской вариант — в порядке"
          $html = Invoke-WebRequest -Uri 'http://127.0.0.1:17845/' -UseBasicParsing
          if ($html.Content -notmatch 'ПНЕВМОТЕХ') { throw 'Интерфейс не отдаётся' }
          foreach ($f in @('/web/js/main.js', '/web/js/docx/kpgen.js', '/web/css/base.css', '/web/vendor/jszip.min.js')) {
            $r = Invoke-WebRequest -Uri ("http://127.0.0.1:17845" + $f) -UseBasicParsing
            if ($r.StatusCode -ne 200 -or $r.Content.Length -lt 100) { throw "Не отдаётся $f" }
          }
          # справочник менеджеров в базе: добавить, прочитать, удалить (через «Настройки», в корзину)
          $mg = Invoke-RestMethod -Method Put -Uri 'http://127.0.0.1:17845/api/managers/ci_manager' -ContentType 'application/json; charset=utf-8' -Body ([Text.Encoding]::UTF8.GetBytes('{"name":"Иванов Иван","phone":"+7 495 000-00-00"}'))
          $mgs = @(Invoke-RestMethod -Uri 'http://127.0.0.1:17845/api/managers' | ForEach-Object { $_ })
          if (-not ($mgs | Where-Object { $_.id -eq 'ci_manager' -and $_.name -eq 'Иванов Иван' })) { throw 'Менеджер не сохранился в базе' }
          $del = Invoke-RestMethod -Method Post -Uri 'http://127.0.0.1:17845/api/admin/delete' -ContentType 'application/json' -Body '{"type":"manager","ids":["ci_manager"]}' -WebSession $adm -Headers $ah
          $trash = @((Invoke-RestMethod -Uri 'http://127.0.0.1:17845/api/admin/trash' -WebSession $adm -Headers $ah).items)
          if (-not ($trash | Where-Object { $_.entityId -eq 'ci_manager' })) { throw 'Удалённый менеджер не попал в корзину' }
          Write-Host 'Справочник менеджеров: в порядке'
          # PDF: чем преобразовать; с LibreOffice — настоящее преобразование DOCX → PDF
          $pa = Invoke-RestMethod -Uri 'http://127.0.0.1:17845/api/pdf'
          Write-Host "PDF: Word=$($pa.word), LibreOffice=$($pa.libreoffice)"
          if ($env:KP_EXE_NAME -eq 'Конструктор КП') {
            if (-not $pa.libreoffice) { throw 'Программа не нашла установленный LibreOffice' }
            $pdf = Invoke-WebRequest -Method Post -Uri 'http://127.0.0.1:17845/api/pdf?name=test.pdf' -InFile (Join-Path $dir 'templates\pnevmotekh\base.docx') -UseBasicParsing -TimeoutSec 300
            $head = [Text.Encoding]::ASCII.GetString($pdf.Content, 0, 5)
            if ($head -ne '%PDF-') { throw "Сервер вернул не PDF: $head" }
            Write-Host "DOCX → PDF через LibreOffice: $($pdf.Content.Length) байт"
          }
          $n = Invoke-RestMethod -Method Post -Uri 'http://127.0.0.1:17845/api/kp/new'
          Write-Host "Новый номер КП: $($n.number)"
          $name = [uri]::EscapeDataString('Проверка КП.docx')
          # настоящий документ Word (сервер принимает только .docx без макросов и внешних шаблонов — DocxCheck, 3.104.2)
          Invoke-RestMethod -Method Put -Uri "http://127.0.0.1:17845/api/kp/$($n.id)/docx?name=$name" -InFile (Join-Path $dir 'templates\pnevmotekh\base.docx') -ContentType 'application/octet-stream' | Out-Null
          if (-not (Test-Path -LiteralPath (Join-Path $dir 'Коммерческие предложения\Проверка КП.docx'))) { throw 'DOCX не сохранился' }
          Invoke-RestMethod -Method Post -Uri 'http://127.0.0.1:17845/api/shutdown' | Out-Null
          if (-not $p.WaitForExit(15000)) { $p.Kill(); throw 'EXE не завершился по команде «Выход»' }
          Write-Host 'Проверка пройдена'

      - name: Проверка обновления патчем (папка update рядом с EXE)
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'kp-smoke'
          $upd = Join-Path $dir 'update'
          New-Item -ItemType Directory -Force -Path $upd | Out-Null
          Copy-Item -Recurse -LiteralPath 'app' -Destination $upd
          Copy-Item -Recurse -LiteralPath 'templates' -Destination $upd
          $vf = Join-Path $upd 'app\version.py'
          [IO.File]::WriteAllText($vf, ([IO.File]::ReadAllText($vf) -replace "VERSION = '[^']+'", "VERSION = '99.0.0'"))
          [IO.File]::WriteAllText((Join-Path $upd 'version.json'), '{"version": "99.0.0"}')
          [IO.File]::WriteAllText((Join-Path $upd 'app\web\ci-patch.json'), '{"patched": true}')
          $p = Start-Process -FilePath (Join-Path $dir 'kp.exe') -WorkingDirectory $dir -PassThru
          $ok = $false
          for ($i = 0; $i -lt 60 -and -not $ok; $i++) {
            Start-Sleep -Seconds 1
            try { $r = Invoke-RestMethod -Uri 'http://127.0.0.1:17845/api/ping' -TimeoutSec 2; $ok = $r.ok } catch {}
          }
          if (-not $ok) { throw 'С папкой update сервер не ответил на /api/ping' }
          $v = Invoke-RestMethod -Uri 'http://127.0.0.1:17845/api/version'
          Write-Host "Версия: $($v.version), обновление: $($v.patched)"
          if ($v.version -ne '99.0.0' -or -not $v.patched) { throw 'Код из папки update не подключился' }
          $mark = Invoke-RestMethod -Uri 'http://127.0.0.1:17845/web/ci-patch.json'
          if (-not $mark.patched) { throw 'Интерфейс не берётся из папки update' }
          $hp = Invoke-WebRequest -Uri 'http://127.0.0.1:17845/' -UseBasicParsing
          if ($hp.StatusCode -ne 200) { throw 'Главная страница не открылась с обновлением' }
          $cat = Invoke-RestMethod -Uri 'http://127.0.0.1:17845/api/catalog'
          if ($cat.Count -lt 1) { throw 'С обновлением каталог пуст' }
          Invoke-RestMethod -Uri 'http://127.0.0.1:17845/api/logos' | Out-Null
          Invoke-RestMethod -Uri 'http://127.0.0.1:17845/api/templates' | Out-Null
          Invoke-RestMethod -Method Post -Uri 'http://127.0.0.1:17845/api/shutdown' | Out-Null
          if (-not $p.WaitForExit(15000)) { $p.Kill(); throw 'EXE с обновлением не завершился' }
          # старое обновление (версия не новее встроенной) не подключается
          [IO.File]::WriteAllText((Join-Path $upd 'version.json'), '{"version": "1.0.0"}')
          $p = Start-Process -FilePath (Join-Path $dir 'kp.exe') -WorkingDirectory $dir -PassThru
          $ok = $false
          for ($i = 0; $i -lt 60 -and -not $ok; $i++) {
            Start-Sleep -Seconds 1
            try { $r = Invoke-RestMethod -Uri 'http://127.0.0.1:17845/api/ping' -TimeoutSec 2; $ok = $r.ok } catch {}
          }
          $v = Invoke-RestMethod -Uri 'http://127.0.0.1:17845/api/version'
          if ($v.patched) { throw 'Подключилось устаревшее обновление' }
          Invoke-RestMethod -Method Post -Uri 'http://127.0.0.1:17845/api/shutdown' | Out-Null
          if (-not $p.WaitForExit(15000)) { $p.Kill() }
          Write-Host 'Обновление патчем: в порядке'

      - name: Установка обновления и перезапуск из «Настроек» (как администратор)
        shell: pwsh
        run: |
          # своя чистая папка с копией EXE: в kp-smoke предыдущие шаги уже создали администратора
          $dir = Join-Path $env:RUNNER_TEMP 'kp-admin-update'
          Remove-Item -Recurse -Force -LiteralPath $dir -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'kp-smoke\kp.exe') -Destination $dir
          # временный ключ подписи проверок: программа доверяет ему через update-keys.txt в своей папке (ключ выпусков не нужен)
          $tk = Join-Path $env:RUNNER_TEMP 'kp-testkey'
          python .github/scripts/sign_update.py gen $tk
          if ($LASTEXITCODE -ne 0) { throw 'Временный ключ подписи не создан' }
          Copy-Item -LiteralPath (Join-Path $tk 'public.txt') -Destination (Join-Path $dir 'update-keys.txt')
          # при сбое — причина в аннотации сборки (видна и без скачивания логов)
          $phase = 'запуск'
          trap {
            $procs = (Get-Process -Name kp -ErrorAction SilentlyContinue | ForEach-Object { $_.Id }) -join ','
            Write-Host ("::error::Обновление из «Настроек», этап «$phase»: " + $_.Exception.Message + ' ' + $_.ErrorDetails.Message + " | процессы kp: $procs | update: " + (Test-Path (Join-Path $dir 'update')))
            break
          }
          Remove-Item -Recurse -Force -LiteralPath (Join-Path $dir 'update') -ErrorAction SilentlyContinue
          function Up { try { (Invoke-RestMethod -Uri 'http://127.0.0.1:17845/api/ping' -TimeoutSec 2).ok } catch { $false } }
          $p = Start-Process -FilePath (Join-Path $dir 'kp.exe') -WorkingDirectory $dir -PassThru
          for ($i = 0; $i -lt 60 -and -not (Up); $i++) { Start-Sleep -Seconds 1 }
          if (-not (Up)) { throw 'Программа не запустилась' }
          $phase = 'администратор'
          # первый администратор (только на этом компьютере) — сессия и CSRF
          $r = Invoke-WebRequest -Method Post -Uri 'http://127.0.0.1:17845/api/admin/setup' -ContentType 'application/json' -Body '{"login":"admin","password":"Ci-Passw0rd1"}' -SessionVariable s -UseBasicParsing
          $csrf = ($r.Content | ConvertFrom-Json).csrf
          if (-not $csrf) { throw 'Администратор не создан' }
          $H = @{ 'X-CSRF-Token' = $csrf }
          $phase = 'архив и загрузка'
          # архив обновления 99.0.1 — как «KP-Obnovlenie-….zip»
          $pt = Join-Path $env:RUNNER_TEMP 'kp-upd\Обновление КП 99.0.1'
          $upd = Join-Path $pt 'update'
          New-Item -ItemType Directory -Force -Path $upd | Out-Null
          Copy-Item -Recurse -LiteralPath 'app', 'templates' -Destination $upd
          $vf = Join-Path $upd 'app\version.py'
          [IO.File]::WriteAllText($vf, ([IO.File]::ReadAllText($vf) -replace "VERSION = '[^']+'", "VERSION = '99.0.1'"))
          [IO.File]::WriteAllText((Join-Path $upd 'version.json'), '{"version": "99.0.1"}')
          $zip = Join-Path $env:RUNNER_TEMP 'KP-Obnovlenie-99.0.1.zip'
          Compress-Archive -Path (Join-Path $env:RUNNER_TEMP 'kp-upd\*') -DestinationPath $zip -Force
          # без подписи архив не устанавливается
          $bad = $null
          try { Invoke-RestMethod -Method Post -Uri 'http://127.0.0.1:17845/api/admin/update/upload?name=ci.zip' -InFile $zip -ContentType 'application/zip' -Headers $H -WebSession $s | Out-Null } catch { $bad = $_ }
          if (-not $bad) { throw 'Установился архив обновления без подписи' }
          python .github/scripts/sign_update.py sign $zip (Join-Path $tk 'key.txt')
          if ($LASTEXITCODE -ne 0) { throw 'Архив обновления не подписан' }
          $res = Invoke-RestMethod -Method Post -Uri 'http://127.0.0.1:17845/api/admin/update/upload?name=ci.zip' -InFile $zip -ContentType 'application/zip' -Headers $H -WebSession $s
          Write-Host "Установлено: $($res.version), файлов: $($res.files)"
          if ($res.version -ne '99.0.1') { throw 'Обновление не установилось' }
          if (-not (Test-Path -LiteralPath (Join-Path $dir 'update\app\kp_server.py'))) { throw 'Нет папки update' }
          $phase = 'перезапуск'
          # перезапуск: программа закрывается и поднимается снова уже с обновлением
          Invoke-RestMethod -Method Post -Uri 'http://127.0.0.1:17845/api/admin/restart' -Headers $H -WebSession $s | Out-Null
          $down = $false
          for ($i = 0; $i -lt 90; $i++) { Start-Sleep -Milliseconds 500; if (-not (Up)) { $down = $true } elseif ($down) { break } }
          if (-not $down) { throw 'Программа не закрылась для перезапуска' }
          if (-not (Up)) { throw 'После перезапуска программа не поднялась' }
          $v = Invoke-RestMethod -Uri 'http://127.0.0.1:17845/api/version'
          Write-Host "После перезапуска: $($v.version), обновление: $($v.patched)"
          if ($v.version -ne '99.0.1' -or -not $v.patched) { throw 'После перезапуска работает не установленная версия' }
          # обновление не запустилось → программа сама возвращается к прежней (99.0.1): ошибка в коде при запуске (99.0.2)
          # и ответ 500 на самопроверке (99.0.3); причина — в «Настройки → Обновления»
          function Patch($ver, $file, $from, $to) {
            $base = Join-Path $env:RUNNER_TEMP "kp-upd-$ver"
            Remove-Item -Recurse -Force -LiteralPath $base -ErrorAction SilentlyContinue
            $u = Join-Path $base "Обновление КП $ver\update"
            New-Item -ItemType Directory -Force -Path $u | Out-Null
            Copy-Item -Recurse -LiteralPath 'app', 'templates' -Destination $u
            $f = Join-Path $u 'app\version.py'
            [IO.File]::WriteAllText($f, ([IO.File]::ReadAllText($f) -replace "VERSION = '[^']+'", "VERSION = '$ver'"))
            [IO.File]::WriteAllText((Join-Path $u 'version.json'), ('{"version": "' + $ver + '"}'))
            $f = Join-Path $u "app\$file"
            $t = [IO.File]::ReadAllText($f)
            if (-not $t.Contains($from)) { throw "Нет строки для поломки в $file" }
            [IO.File]::WriteAllText($f, $t.Replace($from, $to))
            $z = Join-Path $env:RUNNER_TEMP "KP-Obnovlenie-$ver.zip"
            Compress-Archive -Path (Join-Path $base '*') -DestinationPath $z -Force
            python .github/scripts/sign_update.py sign $z (Join-Path $tk 'key.txt') | Out-Host
            if ($LASTEXITCODE -ne 0) { throw "Архив $ver не подписан" }
            return $z
          }
          function Login {
            $r = Invoke-WebRequest -Method Post -Uri 'http://127.0.0.1:17845/api/admin/login' -ContentType 'application/json' -Body '{"login":"admin","password":"Ci-Passw0rd1"}' -SessionVariable ss -UseBasicParsing
            $script:s = $ss
            $script:H = @{ 'X-CSRF-Token' = ($r.Content | ConvertFrom-Json).csrf }
          }
          function Version {
            try { (Invoke-RestMethod -Uri 'http://127.0.0.1:17845/api/version' -TimeoutSec 3).version } catch { '' }
          }
          foreach ($case in @(
              @{ ver = '99.0.2'; file = 'kp_server.py'; from = 'STARTED = False'; to = "STARTED = False; raise RuntimeError('ci: broken update')"; why = 'ci: broken update' },
              @{ ver = '99.0.3'; file = 'web_api.py'; from = "return self.send_json({'version': version.VERSION,"; to = "raise KeyError('ci'); return self.send_json({'version': version.VERSION,"; why = 'Самопроверка' })) {
            $phase = "возврат после сбоя $($case.ver)"
            Login
            $zip = Patch $case.ver $case.file $case.from $case.to
            $res = Invoke-RestMethod -Method Post -Uri 'http://127.0.0.1:17845/api/admin/update/upload?name=ci.zip' -InFile $zip -ContentType 'application/zip' -Headers $H -WebSession $s
            if ($res.version -ne $case.ver) { throw "Обновление $($case.ver) не установилось" }
            Invoke-RestMethod -Method Post -Uri 'http://127.0.0.1:17845/api/admin/restart' -Headers $H -WebSession $s | Out-Null
            $down = $false
            for ($i = 0; $i -lt 40 -and -not $down; $i++) { Start-Sleep -Milliseconds 500; if (-not (Up)) { $down = $true } }
            if (-not $down) { throw 'Программа не закрылась для перезапуска' }
            # сломанная версия может ненадолго подняться (самопроверка ещё идёт) — ждём, пока снова заработает 99.0.1
            $v = ''
            for ($i = 0; $i -lt 120 -and $v -ne '99.0.1'; $i++) { Start-Sleep -Seconds 1; $v = Version }
            Write-Host "После сбоя $($case.ver) работает: $v"
            if ($v -ne '99.0.1') { throw "Программа не вернулась к 99.0.1 после сбоя $($case.ver) (работает: $v)" }
            if (-not (Test-Path -LiteralPath (Join-Path $dir 'update.failed\version.json'))) { throw 'Нет папки update.failed' }
            Login
            $st = Invoke-RestMethod -Uri 'http://127.0.0.1:17845/api/admin/update' -Headers $H -WebSession $s
            Write-Host "Причина: $($st.failed.reason)"
            if ($st.failed.version -ne $case.ver -or -not ([string]$st.failed.reason).Contains($case.why)) { throw "В «Обновлениях» нет причины сбоя $($case.ver)" }
            # EXE в одном файле — два процесса (загрузчик и программа); больше — значит, остался прежний экземпляр
            if (@(Get-Process -Name kp -ErrorAction SilentlyContinue).Count -gt 2) { throw 'После возврата работает больше одного экземпляра программы' }
          }
          Invoke-RestMethod -Method Post -Uri 'http://127.0.0.1:17845/api/shutdown' | Out-Null
          for ($i = 0; $i -lt 30 -and (Up); $i++) { Start-Sleep -Milliseconds 500 }
          if (Up) { throw 'Перезапущенная программа не завершилась' }
          Remove-Item -Recurse -Force -LiteralPath (Join-Path $dir 'update'), (Join-Path $dir 'update.prev'), (Join-Path $dir 'update.failed') -ErrorAction SilentlyContinue
          Write-Host 'Обновление из «Настроек», перезапуск и возврат после неудачного обновления: в порядке'

      - name: Комплект для установки (EXE + сервер отдела)
        shell: pwsh
        run: |
          $pkg = Join-Path $PWD "pkg\$env:KP_EXE_NAME"
          New-Item -ItemType Directory -Force -Path $pkg | Out-Null
          Copy-Item -LiteralPath "dist\$env:KP_EXE_NAME.exe" -Destination $pkg
          Copy-Item -Recurse -LiteralPath 'server-setup' -Destination $pkg
          Copy-Item -LiteralPath 'install\kp-common.ps1' -Destination "$pkg\server-setup"
          Copy-Item -LiteralPath 'Инструкция.txt' -Destination $pkg
          Copy-Item -LiteralPath 'docs\Руководство менеджера.pdf' -Destination $pkg
          Copy-Item -LiteralPath 'docs\Памятка КП за 5 минут.pdf' -Destination $pkg
          New-Item -ItemType Directory -Force -Path "$pkg\install" | Out-Null
          Copy-Item -LiteralPath 'install\Установить в C KP.cmd', 'install\install-full.ps1', 'install\kp-common.ps1' -Destination "$pkg\install"
          Compress-Archive -Path "$pkg\*" -DestinationPath "dist\$env:KP_EXE_NAME.zip" -Force

      - name: Проверка «Остановить сервер» / «Запустить сервер» (server-setup\kp-server.ps1)
        shell: pwsh
        # шаг — в pwsh (файл шага без BOM, Windows PowerShell 5.1 прочёл бы русский текст неверно); сам kp-server.ps1 — как у пользователя, в powershell.exe
        run: |
          $pkg = Join-Path $PWD "pkg\$env:KP_EXE_NAME"
          $ps = Join-Path $pkg 'server-setup\kp-server.ps1'
          $exe = Get-ChildItem -LiteralPath $pkg -Filter '*.exe' | Select-Object -First 1
          function Up { for ($i = 0; $i -lt 60; $i++) { try { $r = Invoke-RestMethod -Uri 'http://127.0.0.1:17845/api/ping' -TimeoutSec 2; if ($r.ok) { return $true } } catch {}; Start-Sleep -Seconds 1 }; return $false }
          function Listening { [bool](netstat -ano | Where-Object { $_ -match '^\s*TCP\s+\S+:17845\s+(0\.0\.0\.0:0|\[::\]:0)\s' }) }
          $p = Start-Process -FilePath $exe.FullName -WorkingDirectory $pkg -PassThru
          if (-not (Up)) { throw 'Программа не запустилась' }
          & powershell -NoProfile -ExecutionPolicy Bypass -File $ps -Action stop -Quiet
          if ($LASTEXITCODE -ne 0) { throw '«Остановить сервер» вернул ошибку' }
          if (Get-Process -Id $p.Id -ErrorAction SilentlyContinue) { throw 'Процесс программы не завершён' }
          if (Listening) { throw 'Порт 17845 всё ещё занят' }
          & powershell -NoProfile -ExecutionPolicy Bypass -File $ps -Action start -Quiet
          if ($LASTEXITCODE -ne 0 -or -not (Up)) { throw '«Запустить сервер» не запустил программу' }
          & powershell -NoProfile -ExecutionPolicy Bypass -File $ps -Action stop -Quiet
          if ($LASTEXITCODE -ne 0 -or (Listening)) { throw 'Повторная остановка не сработала' }
          Write-Host 'Остановка и запуск сервера: в порядке'

      - name: Задача Планировщика сервера отдела — без остановки через 3 дня работы
        shell: pwsh
        run: |
          $pkg = Join-Path $PWD "pkg\$env:KP_EXE_NAME"
          $TASK = 'Конструктор КП — сервер отдела'
          $CTL = 'KP CI — контроль ограничения'
          $exe = Get-ChildItem -LiteralPath $pkg -Filter '*.exe' | Select-Object -First 1
          $ps = Join-Path $pkg 'server-setup\kp-server.ps1'
          function Show($t) { $s = $t.Settings; "ограничение $($s.ExecutionTimeLimit), не запускать от батареи $($s.DisallowStartIfOnBatteries), останавливать от батареи $($s.StopIfGoingOnBatteries), приоритет $($s.Priority), повторы $($s.RestartCount)" }
          function Good($t) { $s = $t.Settings; ($s.ExecutionTimeLimit -eq 'PT0S') -and (-not $s.DisallowStartIfOnBatteries) -and (-not $s.StopIfGoingOnBatteries) -and ($s.Priority -eq 5) -and ($s.RestartCount -eq 3) }
          function Same($t) { ($t.Principal.UserId -match 'SYSTEM') -and ([string]$t.Principal.RunLevel -eq 'Highest') -and ($t.Actions[0].Execute -like ('*' + $exe.Name + '*')) -and ($t.Triggers[0].CimClass.CimClassName -match 'Boot') }
          function Fresh {
            # так задачу создавал «1. Установить сервер отдела.bat» до 3.51.1 — настройки Планировщика по умолчанию
            schtasks /Create /TN $TASK /TR ('"' + $exe.FullName + '"') /SC ONSTART /RU SYSTEM /RL HIGHEST /F | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'schtasks /Create не создал задачу' }
          }
          function Up { try { (Invoke-RestMethod -Uri 'http://127.0.0.1:17845/api/ping' -TimeoutSec 2).ok } catch { $false } }
          $sj = Join-Path $pkg 'settings.json'
          $keep = if (Test-Path -LiteralPath $sj) { [IO.File]::ReadAllText($sj) } else { $null }
          try {
            Fresh
            Write-Host ('По умолчанию: ' + (Show (Get-ScheduledTask -TaskName $TASK)))
            # установщик сервера и установщики комплекта и обновления задают настройки (Set-KPTask)
            & powershell -NoProfile -ExecutionPolicy Bypass -File $ps -Action task -Quiet
            if ($LASTEXITCODE -ne 0) { throw 'kp-server.ps1 -Action task вернул ошибку' }
            $t = Get-ScheduledTask -TaskName $TASK
            Write-Host ('После установщика: ' + (Show $t))
            if (-not (Good $t)) { throw 'Установщик не задал настройки задачи' }
            if (-not (Same $t)) { throw 'После настройки изменились пользователь, права, команда или запуск задачи' }
            # прежняя задача на работающем сервере: программа (от имени SYSTEM, запущенная задачей) исправляет её сама и работает дальше;
            # ограничение — 1 минута вместо 3 дней: видно, действует ли прежнее ограничение на уже запущенную программу
            Fresh
            $t = Get-ScheduledTask -TaskName $TASK; $t.Settings.ExecutionTimeLimit = 'PT1M'; Set-ScheduledTask -InputObject $t | Out-Null
            # контрольная задача с тем же ограничением, которую никто не исправляет: Планировщик должен её остановить
            schtasks /Create /TN $CTL /TR 'cmd /c ping -n 400 127.0.0.1' /SC ONCE /ST 23:59 /RU SYSTEM /F 2>$null | Out-Null
            $c = Get-ScheduledTask -TaskName $CTL; $c.Settings.ExecutionTimeLimit = 'PT1M'; Set-ScheduledTask -InputObject $c | Out-Null
            [IO.File]::WriteAllText($sj, '{"mode": "server", "port": 17845}')
            schtasks /Run /TN $CTL | Out-Null
            schtasks /Run /TN $TASK | Out-Null
            $t0 = Get-Date
            for ($i = 0; $i -lt 60 -and -not (Up); $i++) { Start-Sleep -Seconds 1 }
            if (-not (Up)) { throw 'Сервер отдела не запустился задачей Планировщика' }
            $fixed = $false
            for ($i = 0; $i -lt 50 -and -not $fixed; $i++) { Start-Sleep -Seconds 1; $fixed = Good (Get-ScheduledTask -TaskName $TASK) }
            $t = Get-ScheduledTask -TaskName $TASK
            Write-Host ('Программа исправила задачу через {0:N0} с: {1}' -f ((Get-Date) - $t0).TotalSeconds, (Show $t))
            if (-not $fixed) { throw 'Программа не исправила свою задачу Планировщика' }
            if (-not (Same $t)) { throw 'Программа изменила пользователя, права, команду или запуск задачи' }
            if (-not (Up)) { throw 'Программа остановилась, исправляя свою задачу' }
            # «Настройки → Система» и «Требует внимания»
            try { $r = Invoke-WebRequest -Method Post -Uri 'http://127.0.0.1:17845/api/admin/setup' -ContentType 'application/json' -Body '{"login":"admin","password":"Ci-Passw0rd1"}' -SessionVariable s -UseBasicParsing }
            catch { $r = Invoke-WebRequest -Method Post -Uri 'http://127.0.0.1:17845/api/admin/login' -ContentType 'application/json' -Body '{"login":"admin","password":"Ci-Passw0rd1"}' -SessionVariable s -UseBasicParsing }
            $H = @{ 'X-CSRF-Token' = ($r.Content | ConvertFrom-Json).csrf }
            # итог проверки программа записывает после повторного чтения задачи (ещё один вызов PowerShell) —
            # чуть позже, чем исправление видно в Планировщике; пока не записан, «Система» отвечает pending
            $sys = $null
            for ($i = 0; $i -lt 30; $i++) { $sys = Invoke-RestMethod -Uri 'http://127.0.0.1:17845/api/admin/system' -Headers $H -WebSession $s; if (-not $sys.task.pending) { break }; Start-Sleep -Seconds 1 }
            Write-Host ('«Система»: ' + ($sys.task | ConvertTo-Json -Compress -Depth 4))
            if (-not $sys.task.exists -or @($sys.task.problems).Count -or -not $sys.task.fixed) { throw '«Система» не показывает исправленную задачу' }
            $att = Invoke-RestMethod -Uri 'http://127.0.0.1:17845/api/admin/attention' -Headers $H -WebSession $s
            if (@($att.items | Where-Object { $_.text -like '*Планировщика*' }).Count) { throw 'В «Требует внимания» осталась задача Планировщика' }
            # прошло больше минуты с запуска: исправленная программа работает, контрольную задачу Планировщик остановил
            while (((Get-Date) - $t0).TotalSeconds -lt 90) { Start-Sleep -Seconds 2 }
            $alive = Up
            $ctlStopped = [string](Get-ScheduledTask -TaskName $CTL).State -ne 'Running'
            Write-Host ('Через {0:N0} с (ограничение было 1 мин): программа {1}, контрольная задача {2}' -f ((Get-Date) - $t0).TotalSeconds, $(if ($alive) { 'работает' } else { 'остановлена' }), $(if ($ctlStopped) { 'остановлена Планировщиком' } else { 'ещё работает' }))
            if (-not $alive) { throw 'Прежнее ограничение остановило программу после исправления задачи' }
            if ($ctlStopped) { Write-Host 'Новые настройки задачи действуют на уже запущенную программу сразу' }
            else { Write-Host 'Планировщик не остановил и контрольную задачу за 90 с — проверка ограничения не показательна' }
          } finally {
            & powershell -NoProfile -ExecutionPolicy Bypass -File $ps -Action stop -Quiet
            schtasks /Delete /TN $TASK /F 2>$null | Out-Null
            schtasks /End /TN $CTL 2>$null | Out-Null
            schtasks /Delete /TN $CTL /F 2>$null | Out-Null
            if ($null -ne $keep) { [IO.File]::WriteAllText($sj, $keep) } else { Remove-Item -LiteralPath $sj -ErrorAction SilentlyContinue }
          }
          Write-Host 'Задача Планировщика сервера отдела: в порядке'

      - name: Патч обновления (без EXE, для обеих сборок)
        if: matrix.arch == 'x64'
        shell: pwsh
        env:
          KP_UPDATE_KEY: ${{ secrets.KP_UPDATE_KEY }}
        run: |
          $ver = [regex]::Match((Get-Content -Raw 'app\version.py'), "VERSION = '([^']+)'").Groups[1].Value
          $pt = Join-Path $PWD "patch\Обновление КП $ver"
          $upd = Join-Path $pt 'update'
          New-Item -ItemType Directory -Force -Path $upd | Out-Null
          Copy-Item -Recurse -LiteralPath 'app', 'templates' -Destination $upd
          Get-ChildItem -Recurse -Directory -Path $upd -Filter '__pycache__' | Remove-Item -Recurse -Force
          [IO.File]::WriteAllText((Join-Path $upd 'version.json'), ('{"version": "' + $ver + '"}'))
          Copy-Item -LiteralPath 'install\patch\Установить обновление.cmd', 'install\patch\install-update.ps1', 'install\kp-common.ps1' -Destination $pt
          # файлы управления сервером отдела (остановить / запустить / удалить) — установщик обновления кладёт их в C:\KP\server-setup
          New-Item -ItemType Directory -Force -Path "$pt\server-setup" | Out-Null
          Get-ChildItem -LiteralPath 'server-setup' | Where-Object { -not $_.PSIsContainer -and $_.Name -notlike '1.*' } | Copy-Item -Destination "$pt\server-setup"
          Copy-Item -LiteralPath 'install\kp-common.ps1' -Destination "$pt\server-setup"
          Compress-Archive -Path "$pt\*" -DestinationPath 'dist\Обновление КП.zip' -Force
          # подпись выпуска (app/update_sign.py): программа устанавливает только подписанный архив. Без секрета (сборка
          # проверки) архив не подписан — выпуск в релиз тогда не делается (шаг «Файлы релиза»)
          if ($env:KP_UPDATE_KEY) {
            python .github/scripts/sign_update.py sign 'dist\Обновление КП.zip'
            if ($LASTEXITCODE -ne 0) { throw 'Архив обновления не подписан' }
          } else { Write-Host '::warning::Нет секрета KP_UPDATE_KEY — архив обновления без подписи (выпуск не получится)' }
          Write-Host ("Патч $ver" + ': ' + [math]::Round((Get-Item 'dist\Обновление КП.zip').Length / 1KB) + ' КБ')

      # артефакты — для удобства; при исчерпанной квоте хранилища сборка не падает, выпуск всё равно уходит в релиз
      - uses: actions/upload-artifact@v4
        if: matrix.arch == 'x64'
        continue-on-error: true
        with:
          name: Обновление КП (патч)
          path: dist/Обновление КП.zip
          if-no-files-found: error
          retention-days: 7       # артефакты каждой сборки — неделю (квота хранилища); выпуски — в релизах по тегу v*

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ${{ matrix.exe }}
          path: |
            dist/${{ matrix.exe }}.exe
            dist/${{ matrix.exe }}.zip
          if-no-files-found: error
          retention-days: 7

      - name: Версия программы
        id: ver
        shell: pwsh
        run: |
          $ver = [regex]::Match((Get-Content -Raw 'app\version.py'), "VERSION = '([^']+)'").Groups[1].Value
          "v=$ver" >> $env:GITHUB_OUTPUT

      # по тегу v* или ручным запуском с «release» — тег ставится на собранный коммит.
      # GitHub заменяет кириллицу в именах файлов релиза на «default», поэтому имена — латиницей.
      - name: Файлы релиза
        id: rel
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ver = '${{ steps.ver.outputs.v }}'
          # выпуск — только с подписанным архивом обновления (иначе установленные программы его не примут)
          python .github/scripts/sign_update.py check 'dist\Обновление КП.zip'
          if ($LASTEXITCODE -ne 0) { throw 'Архив обновления не подписан: добавьте секрет KP_UPDATE_KEY (Settings → Secrets and variables → Actions)' }
          $tag = if ('${{ github.ref }}'.StartsWith('refs/tags/')) { '${{ github.ref_name }}' } else { "v$ver" }
          New-Item -ItemType Directory -Force -Path rel | Out-Null
          Copy-Item -LiteralPath "dist\$env:KP_EXE_NAME.exe" -Destination "rel\KP-Konstruktor-$ver-win64.exe"
          Copy-Item -LiteralPath "dist\$env:KP_EXE_NAME.zip" -Destination "rel\KP-Konstruktor-$ver-win64.zip"
          Copy-Item -LiteralPath 'dist\Обновление КП.zip' -Destination "rel\KP-Obnovlenie-$ver.zip"
          "tag=$tag" >> $env:GITHUB_OUTPUT
          # файлы прежних выпусков с кириллицей в имени (стали default.*) — убрать
          $names = gh release view $tag --json assets --jq '.assets[].name' 2>$null
          foreach ($n in @($names)) { if ($n -like 'default*') { gh release delete-asset $tag $n --yes } }
          $global:LASTEXITCODE = 0

      - name: Публикация в релиз
        if: steps.rel.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Конструктор КП ${{ steps.ver.outputs.v }}
          body: |
            Конструктор КП ${{ steps.ver.outputs.v }} — Windows 8.1 / 10 / 11, 64-бит (сервер отдела; сотрудники работают в браузере).
            • KP-Konstruktor-${{ steps.ver.outputs.v }}-win64.exe — программа («Конструктор КП.exe»).
            • KP-Konstruktor-${{ steps.ver.outputs.v }}-win64.zip — комплект: EXE, установка в C:\KP, сервер отдела, инструкция.
            • KP-Obnovlenie-${{ steps.ver.outputs.v }}.zip — патч «Обновление КП» для уже установленной программы (запустить «Установить обновление.cmd»).
            Что нового — «?» → «История версий» в программе.
          files: rel/*
